}
// réverbération propre à une source : coupée en même temps qu'elle
function convTo(dest, amt){ const ac = SND.ac, c = ac.createConvolver(); c.buffer = irBuf(); const g = ac.createGain(); g.gain.value = amt; c.connect(g); g.connect(dest); return c; }
// bus de sortie qu'on peut couper net (signaux, respiration)
function bus(k){ if (!SND[k]){ const g = SND.ac.createGain(); g.connect(SND.master); SND[k] = g; } return SND[k]; }
function hushBus(k){
 const b = SND[k]; if (!b || !SND.ac) return; SND[k] = null;
 const t = SND.ac.currentTime;
 try { b.gain.cancelScheduledValues(t); b.gain.setValueAtTime(b.gain.value, t); b.gain.linearRampToValueAtTime(0, t + .025); } catch(e) {}
 setTimeout(() => { try { b.disconnect(); } catch(e) {} }, 60);
}
// coupe immédiatement tous les sons (arrêt, sortie d'une page)
function soundHushAll(){
 clearTimeout(SND.previewT);
 if (SND.cur){ SND.cur.stop(.025); SND.cur = null; }
 hushBus("sig"); hushBus("brBus");
 mediaRelease();
}
function nz(type, dest, gain){ const ac = SND.ac, s = ac.createBufferSource(); s.buffer = noiseBuf(type); s.loop = true; const g = ac.createGain(); g.gain.value = gain; s.connect(g); g.connect(dest); s.start(0, Math.random() * 3.5); return s; }
function filt(type, f, q, dest){ const n = SND.ac.createBiquadFilter(); n.type = type; n.frequency.value = f; if (q != null) n.Q.value = q; n.connect(dest); return n; }
function lfo(freq, depth, param, base){ const ac = SND.ac, o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = freq; g.gain.value = depth; param.value = base; o.connect(g); g.connect(param); o.start(); return o; }
function pan(dest, v){ const ac = SND.ac; if (!ac.createStereoPanner || !v) return dest; const p = ac.createStereoPanner(); p.pan.value = v; p.connect(dest); return p; }
function tone(dest, f, t0, dur, peak, type, attack){
 const ac = SND.ac, o = ac.createOscillator(), g = ac.createGain();
 o.type = type || "sine"; o.frequency.value = f;
 g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + (attack || .01)); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
 o.connect(g); g.connect(dest); o.start(t0); o.stop(t0 + dur + .05);
 return o;
}
// note de piano électrique douce (synthèse FM)
function epNote(dest, f, t, vel, len){
 const ac = SND.ac, c = ac.createOscillator(), m = ac.createOscillator(), mg = ac.createGain(), g = ac.createGain();
 c.frequency.value = f; m.frequency.value = f; m.connect(mg); mg.connect(c.frequency);
 mg.gain.setValueAtTime(f * 1.4, t); mg.gain.exponentialRampToValueAtTime(f * .08, t + 1.6);
 g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vel, t + .008);
 g.gain.exponentialRampToValueAtTime(vel * .35, t + .9); g.gain.exponentialRampToValueAtTime(.0001, t + len);
 c.connect(g); g.connect(dest); c.start(t); m.start(t); c.stop(t + len + .1); m.stop(t + len + .1);
 tone(dest, f * 2, t, 1.4, vel * .12, "sine", .006);
}
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

// ── Ambiances ────────────────────────────────────────────────
// Une ambiance = {out, stop}. Les enregistrements se chargent à la
// demande ; le son monte en douceur dès qu'il est prêt.
const AMB_FILES = {forest:["forest-birds","forest-birds2","forest-wind"], rain:["rain"], storm:["rain","thunder1","thunder2","thunder3"], waves:["waves"], stream:["stream"], night:["crickets","owl","forest-wind"], fire:["fire"], chimes:["chimes"], bowl:["bowl"]};
function makeAmbience(key, fade, onReady){
 const ac = SND.ac, post = ac.createGain(); post.gain.value = .0001; post.connect(SND.ambBus);
 const out = ac.createGain(); out.connect(post);
 let conv = null;
 const nodes = [], timers = [];
 let alive = true, readyDone = false;
 const ready = () => { if (!alive || readyDone) return; readyDone = true; const t = ac.currentTime; post.gain.cancelScheduledValues(t); post.gain.setValueAtTime(.0001, t); post.gain.exponentialRampToValueAtTime(1, t + fade); onReady && onReady(); };
 const loop = (fn, a, b, first) => { const go = () => { if (!alive) return; fn(); timers.push(setTimeout(go, rnd(a, b))); }; timers.push(setTimeout(go, first != null ? first : rnd(0, a))); };
 const wet = amt => { conv = conv || convTo(post, .5); const s = ac.createGain(); s.gain.value = amt; out.connect(s); s.connect(conv); return s; };
 const fallback = () => { if (alive) synthAmbience(key, out, nodes, loop, wet); ready(); };
 const files = AMB_FILES[key];
 if (!files){ synthAmbience(key, out, nodes, loop, wet); ready(); }
 else Promise.all(files.map(loadSample)).then(B => {
  if (!alive) return;
  if (key === "forest"){
   nodes.push(loopSample(B[0], out, .85, 0), loopSample(B[1], pan(out, .35), .4, .5));
   nodes.push(loopSample(B[2], filt("lowpass", 2400, .5, out), .32, .3));
  } else if (key === "storm"){
   nodes.push(loopSample(B[0], out, .95, .4));
   const g = ac.createGain(); g.connect(out);
   nodes.push(nz("brown", filt("lowpass", 160, .7, g), 1)); nodes.push(lfo(.03, .18, g.gain, .22));
   wet(.35);
   const th = B.slice(1);
   loop(() => { const far = Math.random() < .5; nodes.push(oneShot(pick(th), out, far ? rnd(.25, .45) : rnd(.55, .9), far ? rnd(.78, .88) : rnd(.92, 1.04), rnd(-.6, .6))); }, 14000, 38000, rnd(3000, 7000));
  } else if (key === "night"){
   nodes.push(loopSample(B[0], out, .8, 0));
   nodes.push(loopSample(B[2], filt("lowpass", 700, .5, out), .18, .6));
   wet(.25);
   loop(() => nodes.push(oneShot(B[1], out, rnd(.18, .32), rnd(.97, 1.03), rnd(-.8, .8))), 40000, 90000, rnd(12000, 25000));
  } else if (key === "chimes"){
   nodes.push(loopSample(B[0], out, .75, 0)); wet(.3);
  } else if (key === "bowl"){
   wet(.45);
   // bols accordés (fondamentale, quarte et quinte en dessous, seconde), frappés doucement
   const RATES = [1, .749, .667, .891];
   loop(() => nodes.push(oneShot(B[0], out, rnd(.45, .7), pick(RATES), rnd(-.45, .45))), 13000, 24000, 50);
  } else {
   nodes.push(loopSample(B[0], out, 1, 0));
  }
  ready();
 }).catch(fallback);

 return {
  out: post,
  stop(f){
   alive = false; timers.forEach(clearTimeout);
   const t = ac.currentTime;
   try { post.gain.cancelScheduledValues(t); post.gain.setValueAtTime(Math.max(post.gain.value, .0001), t); post.gain.exponentialRampToValueAtTime(.0001, t + f); } catch(e) {}
   setTimeout(() => { nodes.forEach(n => { try { n.stop(); } catch(e) {} }); try { post.disconnect(); } catch(e) {} }, f * 1000 + 120);
  }
 };
}

// Ambiances synthétisées (et secours si un enregistrement ne charge pas)
function synthAmbience(key, out, nodes, loop, wet){
 const ac = SND.ac;
 if (key === "white"){
  nodes.push(nz("white", filt("lowpass", 7000, .5, out), .5));
 } else if (key === "brown"){
  nodes.push(nz("brown", filt("lowpass", 900, .5, out), .9));
  nodes.push(nz("pink", filt("lowpass", 3000, .5, out), .15));
 } else if (key === "pad"){
  const lp = filt("lowpass", 1300, .7, out); nodes.push(lfo(.045, 450, lp.frequency, 1300));
  wet(.7);
  // Fa maj7 → Do/Mi → Ré m9 → Si♭ maj7, très lent
  const CH = [[87.31,174.61,220.00,261.63,329.63],[82.41,130.81,196.00,246.94,293.66],[73.42,146.83,174.61,220.00,329.63],[58.27,116.54,174.61,233.08,293.66]];
  let c = 0;
  loop(() => {
   const t = ac.currentTime + .05, dur = 17;
   CH[c++ % CH.length].forEach((f, j) => {
    const voices = j === 0 ? [["sine", 0, 0]] : [["sawtooth", -7, -.5], ["sawtooth", 7, .5]];
    voices.forEach(([type, dt, pv]) => {
     const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f; o.detune.value = dt;
     const peak = j === 0 ? .05 : .011;
     g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(peak, t + 6); g.gain.setValueAtTime(peak, t + dur - 6); g.gain.linearRampToValueAtTime(.0001, t + dur);
     o.connect(g); g.connect(pan(lp, pv)); o.start(t); o.stop(t + dur + .1); nodes.push(o);
    });
   });
  }, 12000, 12000, 50);
 } else if (key === "piano"){
  const dry = ac.createGain(); dry.gain.value = 1; dry.connect(out);
  wet(.9);
  // accords lents (main gauche) et mélodie pentatonique (main droite)
  const CH = [[130.81,164.81,196.00,246.94],[110.00,130.81,164.81,196.00],[87.31,130.81,164.81,220.00],[98.00,146.83,196.00,220.00]];
  const MEL = [523.25,587.33,659.25,783.99,880.00,1046.50,1174.66];
  const beat = 1.15; let bar = 0, mi = 3, next = ac.currentTime + .1;
  const playBar = () => {
   const ch = CH[bar++ % CH.length], t0 = Math.max(next, ac.currentTime + .05);
   ch.forEach((f, j) => epNote(dry, f, t0 + j * .09, .05, 5.5));
   for (let b = 0; b < 4; b++){
    if (Math.random() < .55){
     mi = Math.max(0, Math.min(MEL.length - 1, mi + pick([-2, -1, -1, 0, 1, 1, 2])));
     epNote(dry, MEL[mi], t0 + b * beat + (b ? rnd(-.03, .05) : .25), rnd(.035, .06), 4);
    }
   }
   next = t0 + beat * 4;
  };
  loop(playBar, beat * 4000, beat * 4000, 50);
 } else if (key === "rain" || key === "storm"){
  nodes.push(nz("pink", filt("highpass", 450, .5, filt("lowpass", 7500, .5, out)), .9));
  nodes.push(nz("brown", filt("lowpass", 350, .7, out), .35));
 } else if (key === "waves"){
  const g = ac.createGain(); g.connect(out);
  const lp = filt("lowpass", 600, .6, g); nodes.push(nz("brown", lp, .5)); nodes.push(lfo(.07, 420, lp.frequency, 650)); nodes.push(lfo(.07, .42, g.gain, .5));
 } else {
  nodes.push(nz("pink", filt("bandpass", 1200, .6, out), .5));
 }
}

function ambStart(key, fade = 3, onReady){
 if (!audioInit()) return;
 ambStop(.8);
 if (!key || key === "none") return;
 SND.cur = makeAmbience(key, fade, onReady);
}
function ambStop(fade = 2){ clearTimeout(SND.previewT); if (SND.cur){ SND.cur.stop(fade); SND.cur = null; } mediaRelease(); }
function ambVolume(v){ SND.vol = v; if (SND.ambBus) SND.ambBus.gain.setTargetAtTime(SND.muted ? 0 : v, SND.ac.currentTime, .1); }
function ambMute(m){ SND.muted = m; ambVolume(SND.vol); }
function ambPreview(key){
 clearTimeout(SND.previewT);
 ambStart(key, 1.2, () => { clearTimeout(SND.previewT); SND.previewT = setTimeout(() => ambStop(2), 9000); });
}
function preloadFor(key){ if (audioInit()) (AMB_FILES[key] || []).forEach(n => loadSample(n).catch(() => {})); }
// Signal de début (n = 1) ou de fin (n = 2) d'un point
function signal(kind, n){
 if (navigator.vibrate) { try { navigator.vibrate(n > 1 ? [120, 80, 120] : 150); } catch(e) {} }
 if (kind === "none" || !SND.ac) return;
 const ac = SND.ac, t = ac.currentTime + .02;
 try {
  const bowl = SND.files.bowl;
  if (kind === "bip"){
   for (let k = 0; k < n; k++) tone(bus("sig"), n > 1 ? 880 : 660, t + k * .22, .18, .25);
  } else if (kind === "bowl" && bowl && !(bowl instanceof Promise)){
   for (let k = 0; k < n; k++){
    const t0 = t + k * .6, src = ac.createBufferSource(), g = ac.createGain();
    src.buffer = bowl; src.playbackRate.value = k ? 1.335 : 1;
    g.gain.setValueAtTime(.55, t0); g.gain.setValueAtTime(.55, t0 + 3.5); g.gain.exponentialRampToValueAtTime(.0001, t0 + 7);
    src.connect(g); g.connect(bus("sig")); src.start(t0); src.stop(t0 + 7.1);
   }
  } else {
   if (kind === "bowl") loadSample("bowl").catch(() => {});
   const notes = n > 1 ? [523.25, 783.99] : [659.25];
   notes.forEach((f, k) => [[1,1,2.6],[2.76,.35,1.4],[5.4,.12,.7]].forEach(([r, a, d]) => tone(bus("sig"), f * r, t + k * .38, d, .16 * a, "sine", .005)));
  }
 } catch(e) {}
}

// ─────────────────────────────────────────────────────────────
// Séance guidée : réglages (fenêtre de type iOS), puis un point à
// la fois avec minuteur. Uniquement des déclarations : ce qui vient
// de app.js (S, BY, push…) est utilisé au moment de l'appel.
// ─────────────────────────────────────────────────────────────
const SESS_DUR = [30, 60, 90, 120];
const SESS_PAUSE = [5, 10, 20];
let SU = null;   // séance en préparation
let SS = null;   // séance en cours

const fmtDur = s => s < 60 ? `${s} s` : `${Math.floor(s/60)} min${s % 60 ? " " + String(s % 60).padStart(2,"0") : ""}`;
const fmtClock = s => { const c = Math.ceil(s - 0.001); return `${Math.floor(c/60)}:${String(c % 60).padStart(2,"0")}`; };
const fmtTotal = s => s < 60 ? `${s} s` : `${Math.round(s/60)} min`;
const msi = (n, fill) => `<span class="msi${fill ? " msi-fill" : ""}" aria-hidden="true">${n}</span>`;

function sessOpts(){
 const o = Object.assign({dur:60, pause:10, sides:"seq", signal:"bip", amb:"none", vol:.7}, S.sess || {});
 if (!AMBIENCES.some(a => a[0] === o.amb)) o.amb = o.amb === "melody" ? "piano" : "none";
 if (o.sound === false && !S.sess.signal) o.signal = "none";
 delete o.sound;
 return o;
}
function saveOpts(){ S.sess = {...SU.opts}; save(); }
function sideOf(p){
 if (p.id === "SISHENCONG") return "Les quatre points, l'un après l'autre";
 if (!bilateral(p)) return p.m === "GV" || p.m === "CV" ? "Un seul point, sur la ligne du milieu" : "Un seul endroit";
 return null;
}
// Pour un point des deux côtés : lequel montrer sur le schéma (côté gauche
// ou droit de la personne). Vue de face : la gauche de la personne est à
// droite de l'image ; vue de dos : à gauche.
function sideCoords(p, v, lr){
 const s = spot(p, v);
 if (!lr || (v !== "front" && v !== "back") || (p.d && p.d.v === v) || !bilateral(p)) return {only:null, x:s.x, y:s.y};
 const mainIsLeft = (s.x < 200) === (v === "back");
 const mirror = lr === "L" ? !mainIsLeft : mainIsLeft;
 return {only: mirror ? "mirror" : "base", x: mirror ? 400 - s.x : s.x, y: s.y};
}

function modalBar(title, left, right){
 return `<div class="bar mbar">${left}<span class="bar-t">${title}</span><span class="bar-r">${right || ""}</span></div>`;
}
function segc(key, vals, cur, label){
 return `<div class="segc" role="radiogroup" aria-label="${label}">${vals.map(([v, t]) =>
  `<button role="radio" data-s="opt" data-k="${key}" data-v="${v}" aria-checked="${String(cur) === String(v)}">${t}</button>`).join("")}</div>`;
}
function scale(k, val){
 return `<div class="scale11" role="group" aria-label="Gêne de 0 à 10">${Array.from({length:11}, (_, n) =>
  `<button data-s="rate" data-k="${k}" data-v="${n}" aria-pressed="${val === n}">${n}</button>`).join("")}</div>`;
}
function estimate(it){ // durée estimée avec les réglages enregistrés
 const o = sessOpts();
 return it.pts.filter(id => !(S.preg && BY[id].preg === "ci")).reduce((a, id) => { const p = BY[id], two = !sideOf(p) && o.sides === "seq"; return a + o.dur + o.pause + (two ? o.dur + Math.min(5, o.pause) : 0); }, 0);
}

// ── Préparation ─────────────────────────────────────────────
function openSetup(ref){
 const [ck, sk] = ref.split("/");
 const cat = SYMPTOMS.find(x => x.k === ck), it = cat && cat.items.find(x => x.k === sk);
 if (!it || !it.pts.length) return;
 const o = sessOpts();
 SU = { ref, cat, it, opts:o, before:null,
  list: it.pts.map(id => ({ id, on: !(S.preg && BY[id].preg === "ci"), dur: o.dur })) };
 push(setupHTML(), el => { el.dataset.sess = "setup"; }, "modal");
}
function buildSteps(){
 const steps = [];
 for (const r of SU.list){
  if (!r.on) continue;
  const p = BY[r.id], one = sideOf(p);
  if (!one && SU.opts.sides === "seq"){
   steps.push({id:r.id, dur:r.dur, side:"Côté gauche", lr:"L"});
   steps.push({id:r.id, dur:r.dur, side:"Côté droit", lr:"R", swap:true});
  } else steps.push({id:r.id, dur:r.dur, side: one || "Les deux côtés en même temps"});
 }
 return steps;
}
const pauseOf = (st, o) => st.swap ? Math.min(5, o.pause) : o.pause;
const totalOf = steps => steps.reduce((a, st) => a + st.dur + pauseOf(st, SU.opts), 0);

function setupHTML(){
 const {cat, it, opts:o} = SU;
 const steps = buildSteps(), total = totalOf(steps), n = SU.list.filter(r => r.on).length;
 const rows = SU.list.map((r, i) => {
  const p = BY[r.id], one = sideOf(p), ci = S.preg && p.preg === "ci";
  const side = one ? one : o.sides === "seq" ? "Gauche, puis droite" : "Les deux côtés ensemble";
  return `<li class="pt-row${r.on ? "" : " off"}">
   <button class="ck" data-s="tog" data-i="${i}" role="checkbox" aria-checked="${r.on}" aria-label="Inclure ${code(p)} ${p.py}">${msi(r.on ? "check_circle" : "radio_button_unchecked", r.on)}</button>
   <span class="pt-t"><span class="pt-l"><span class="pt-n">${i + 1}</span><span class="code" style="${elVar(p.m)}">${code(p)}</span><b>${p.py}</b></span><span class="pt-fs">${p.fs}</span><span class="pt-side${ci ? " is-ci" : ""}">${ci ? "À éviter pendant la grossesse" : side}</span></span>
  </li>`;
 }).join("");
 const amb = AMB_GROUPS.map(([g, list]) => `<p class="amb-g">${g}</p><div class="amb-grid">${list.map(([k, t, ic]) => `<button class="amb${o.amb === k ? " on" : ""}" data-s="opt" data-k="amb" data-v="${k}" aria-pressed="${o.amb === k}">${msi(ic, o.amb === k)}<span>${t}</span></button>`).join("")}</div>`).join("");
 return `${modalBar("Séance guidée", `<button class="mbar-l" data-act="back">Annuler</button>`)}
 <article class="detail sx">
  <p class="eyebrow" style="color:var(--c-${cat.k})">${cat.name}</p>
  <h1 class="h1d">${it.name}</h1>
  <div class="sx-sum"><span><b>${n}</b> point${n > 1 ? "s" : ""}</span><span><b>${steps.length}</b> étape${steps.length > 1 ? "s" : ""}</span><span><b>${fmtTotal(total)}</b> en tout</span></div>

  <h3 class="grp-t">Minuteur</h3>
  <div class="grp">
   <div class="grp-row col"><span class="grp-l">Durée par point</span>${segc("dur", SESS_DUR.map(d => [d, fmtDur(d)]), o.dur, "Durée par point")}</div>
   <div class="grp-row col"><span class="grp-l">Temps pour trouver le point</span>${segc("pause", SESS_PAUSE.map(d => [d, fmtDur(d)]), o.pause, "Temps pour trouver le point")}</div>
   <div class="grp-row col"><span class="grp-l">Points des deux côtés</span>${segc("sides", [["seq","L'un après l'autre"],["both","En même temps"]], o.sides, "Points des deux côtés")}</div>
  </div>
  <p class="grp-foot">${o.sides === "seq" ? "Le minuteur compte chaque côté séparément." : "Les deux côtés en même temps, avec les deux mains."}</p>

  <h3 class="grp-t">Son</h3>
  <div class="grp">
   <div class="grp-row col"><span class="grp-l">Signal entre les points</span>${segc("signal", SIGNALS, o.signal, "Signal entre les points")}</div>
   <div class="grp-row col"><span class="grp-l">Ambiance de fond</span>${amb}</div>
   <div class="grp-row vol-row${o.amb === "none" ? " is-off" : ""}">${msi("volume_down")}<input class="vol" type="range" min="0" max="1" step="0.05" value="${o.vol}" data-s="vol" aria-label="Volume de l'ambiance">${msi("volume_up")}</div>
  </div>
  <p class="grp-foot">Touchez une ambiance pour l'écouter quelques secondes. Écouteurs conseillés pour la nature. Sur iPhone, désactivez le mode silencieux.</p>

 </article>
 <div class="sx-dock"><button class="btn btn-primary btn-go" data-s="start" ${n ? "" : "disabled"}>${msi("play_arrow", true)}Commencer · ${fmtTotal(total)}</button></div>`;
}
function setupAction(t, sheet){
 const a = t.dataset.s, i = +t.dataset.i, o = SU.opts;
 if (a === "vol") return;
 if (a === "opt"){
  const k = t.dataset.k, v = (k === "sides" || k === "signal" || k === "amb") ? t.dataset.v : +t.dataset.v;
  o[k] = v;
  if (k === "dur") SU.list.forEach(r => r.dur = v);
  if (k === "amb"){ audioInit(); ambVolume(o.vol); ambPreview(v); }
  if (k === "signal"){ audioInit(); if (v === "bowl") loadSample("bowl").then(() => signal(v, 2)).catch(() => signal(v, 2)); else signal(v, 2); }
  saveOpts();
 }
 else if (a === "tog") SU.list[i].on = !SU.list[i].on;
 else if (a === "rate") SU.before = SU.before === +t.dataset.v ? null : +t.dataset.v;
 else if (a === "start") return startSession();
 const y = sheet.scrollTop;
 replaceTop(setupHTML());
 sheet.scrollTop = y;
 const f = sheet.querySelector(`[data-s="${a}"]${t.dataset.i !== undefined ? `[data-i="${i}"]` : ""}${t.dataset.v !== undefined ? `[data-v="${t.dataset.v}"]` : ""}${t.dataset.k ? `[data-k="${t.dataset.k}"]` : ""}`);
 f && !f.disabled && f.focus({preventScroll:true});
}
function setupInput(e){
 const t = e.target; if (!SU || t.dataset.s !== "vol") return;
 SU.opts.vol = +t.value; ambVolume(SU.opts.vol);
 if (!SND.cur && SU.opts.amb !== "none"){ audioInit(); ambPreview(SU.opts.amb); }
 clearTimeout(setupInput.t); setupInput.t = setTimeout(saveOpts, 400);
}

// ── Écran allumé ─────────────────────────────────────────────
let WL = null;
async function keepAwake(on){
 try {
  if (on && "wakeLock" in navigator && !WL) { WL = await navigator.wakeLock.request("screen"); WL.addEventListener("release", () => { WL = null; }); }
  if (!on && WL) { await WL.release(); WL = null; }
 } catch(e) { WL = null; }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && SS && !SS.paused && SS.phase !== "end") keepAwake(true); });

// ── Lecteur ──────────────────────────────────────────────────
function startSession(){
 audioInit(); clearTimeout(SND.previewT); ambStop(.3); ambMute(false); ambVolume(SU.opts.vol);
 if (SU.opts.signal === "bowl") loadSample("bowl").catch(() => {});
 const steps = buildSteps(); if (!steps.length) return;
 SS = { steps, i:0, phase:"find", paused:false, end:0, len:0, remaining:0, t0:Date.now(), el:null, timer:null, after:null, drawn:-1 };
 SS.el = push(`<div class="sess-wrap"></div>`, e => { e.dataset.sess = "play"; e.classList.add("sheet-play"); }, "modal");
 enterPhase("find");
 SS.timer = setInterval(tick, 200);
 keepAwake(true);
 ambStart(SU.opts.amb, 4);
}
function enterPhase(phase){
 const st = SS.steps[SS.i];
 const prev = SS.phase;
 SS.phase = phase;
 SS.len = phase === "find" ? pauseOf(st, SU.opts) : st.dur;
 SS.remaining = SS.len;
 SS.end = Date.now() + SS.len * 1000;
 if (SS.drawn !== SS.i || prev === "end") renderPlayer(); else updateStatus(true);
 if (phase === "press") signal(SU.opts.signal, 1);
}
// ── Rendu : la mise en page d'une étape est dessinée une fois ; changer de
// phase, mettre en pause ou faire avancer le temps ne met à jour que le bloc d'état.
const PHASE = {find:"Trouvez le point", press:"Maintenez la pression"};
const stepLen = st => pauseOf(st, SU.opts) + st.dur;
function ptIndex(i){ const seen = []; for (let j = 0; j <= i; j++){ const id = SS.steps[j].id; if (!seen.includes(id)) seen.push(id); } return seen.length; }
const nPts = () => new Set(SS.steps.map(x => x.id)).size;
function timeLeft(){
 const st = SS.steps[SS.i];
 let t = SS.remaining + (SS.phase === "find" ? st.dur : 0);
 for (let j = SS.i + 1; j < SS.steps.length; j++) t += stepLen(SS.steps[j]);
 return t;
}
const fmtLeft = t => t < 60 ? "moins d'une minute" : `${Math.round(t / 60)} min restante${Math.round(t / 60) > 1 ? "s" : ""}`;
// Petit corps vu de dos : la moitié du côté à presser est colorée.
function sideIcon(st){
 const L = st.lr === "L", R = st.lr === "R", both = !st.lr && !sideOf(BY[st.id]), mid = !st.lr && !both;
 const on = "var(--sg-accent)", off = "color-mix(in srgb,var(--ink) 18%,transparent)";
 const half = (x, c) => `<path d="M${x ? 12 : 12} 7.6c${x ? "3.2 0 4.6 1.2 4.9 3.6l.9 7.4h-2.2l-.5 9.4h-3.1z" : "-3.2 0-4.6 1.2-4.9 3.6l-.9 7.4h2.2l.5 9.4h3.1z"}" fill="${c}"/>`;
 return `<svg class="sg-body" viewBox="0 0 24 30" aria-hidden="true"><circle cx="12" cy="3.6" r="3" fill="${off}"/>${half(0, L || both ? on : off)}${half(1, R || both ? on : off)}${mid ? `<rect x="11.2" y="8" width="1.6" height="19" rx=".8" fill="${on}"/>` : ""}</svg>`;
}
const sideTxt = st => st.lr === "L" ? "Côté gauche" : st.lr === "R" ? "Côté droit" : sideOf(BY[st.id]) ? sideOf(BY[st.id]) : "Les deux côtés";
function renderPlayer(){
 const wrap = SS.el.querySelector(".sess-wrap"); if (!wrap) return;
 const mute = `<button class="mbar-ic" data-s="mute" aria-label="${SND.muted ? "Remettre le son" : "Couper le son"}" aria-pressed="${SND.muted}">${msi(SND.muted ? "volume_off" : "volume_up")}</button>`;
 const top = modalBar(SU.it.name, `<button class="mbar-ic" data-act="back" aria-label="Quitter la séance">${msi("close")}</button>`, mute);
 if (SS.phase === "end"){ SS.drawn = -1; wrap.className = "sess-wrap"; wrap.innerHTML = top + endHTML(); return; }
 SS.drawn = SS.i;
 const st = SS.steps[SS.i], p = BY[st.id], nx = SS.steps[SS.i + 1], np = nx && BY[nx.id];
 const next = nx ? `<div class="sg-next"><span class="sg-thumb" aria-hidden="true"></span><span class="sg-next-t"><small>Ensuite</small><span><span class="code" style="${elVar(np.m)}">${code(np)}</span><b>${np.py}</b><i>${nx.id === st.id ? sideTxt(nx) : nx.lr ? sideTxt(nx) : ""}</i></span></span></div>`
  : `<div class="sg-next is-last"><span class="sg-next-t"><small>Ensuite</small><span><b>Fin de la séance</b></span></span></div>`;
 wrap.className = "sess-wrap is-step sg";
 wrap.innerHTML = `${top}
 <div class="sg-prog"><div class="sg-segs" aria-hidden="true">${SS.steps.map((x, j) => `<i class="${j < SS.i ? "done" : ""}"><b></b></i>`).join("")}</div></div>
 <article class="sg-main">
  <div class="sg-name"><span class="code" style="${elVar(p.m)}">${code(p)}</span><h1>${p.py}</h1>
   <p class="sg-meta"><span>Point ${ptIndex(SS.i)} sur ${nPts()}</span></p></div>
  <div class="sg-stage"></div>
  <div class="sg-how"><p><b>Pour le trouver</b> ${p.rep}</p></div>
  <section class="sg-card">
   <div class="sg-status" aria-live="polite"></div>
   <div class="sg-bar" role="progressbar" aria-label="Temps de l'étape" aria-valuemin="0" aria-valuemax="100"><i></i></div>
  </section>
  ${next}
 </article>`;
 fillSessFig();
 if (nx){ const th = wrap.querySelector(".sg-thumb"); if (th) th.innerHTML = pointFig(np, {ctx:"card", w:44, aspect:1, lr:nx.lr}).html; }
 updateStatus(false);
}
// Bloc d'état : phase, côté, chrono numérique, +15 s / « Je suis prêt ».
function updateStatus(animate){
 const el = SS.el.querySelector(".sg-status"); if (!el) return;
 const st = SS.steps[SS.i], find = SS.phase === "find";
 const wrap = SS.el.querySelector(".sess-wrap");
 wrap.classList.toggle("is-find", find); wrap.classList.toggle("is-press", !find); wrap.classList.toggle("is-paused", SS.paused);
 const label = SS.paused ? "En pause" : find ? (st.swap ? "Changez de côté" : PHASE.find) : PHASE.press;
 const sub = SS.paused ? (find ? PHASE.find : PHASE.press) : find ? "Suivez les repères" : "Respirez au rythme du halo";
 const act = find && !SS.paused ? `<button class="sg-ready" data-s="ready">Je suis prêt</button>` : `<button class="sg-plus" data-s="plus15" aria-label="Ajouter 15 secondes">+15 s</button>`;
 el.innerHTML = `<div class="sg-st${animate ? " swap" : ""}">
  <div class="sg-st-top"><p class="sg-phase">${label}</p>
   <div class="sg-ctl" role="group" aria-label="Commandes">
    <button class="sg-ic" data-s="prev" aria-label="Point précédent">${msi("skip_previous", true)}</button>
    <button class="sg-ic sg-play" data-s="toggle" aria-label="${SS.paused ? "Reprendre" : "Pause"}">${msi(SS.paused ? "play_arrow" : "pause", true)}</button>
    <button class="sg-ic" data-s="next" aria-label="Point suivant">${msi("skip_next", true)}</button>
   </div></div>
  <div class="sg-st-bot"><p class="sg-side">${sideIcon(st)}<span>${sideTxt(st)}</span></p>${act}</div>
 </div>`;
 const stg = SS.el.querySelector(".sg-stage"); stg && stg.classList.toggle("is-press", !find && !SS.paused);
 updateRing();
}
// L'illustration prend toute la place libre : on mesure la zone, puis on cadre.
function fillSessFig(){
 if (!SS || SS.phase === "end") return;
 const box = SS.el.querySelector(".sg-stage"); if (!box) return;
 const st = SS.steps[SS.i], p = BY[st.id];
 const w = Math.max(120, box.clientWidth), h = Math.max(120, box.clientHeight);
 const F = pointFig(p, {ctx:"sess", w, aspect: Math.max(.45, Math.min(2, w / h)), lr: st.lr, maxH: h});
 box.innerHTML = `${F.html}<span class="sp-cap sg-cap">${F.cap}${F.mer ? `<small><i aria-hidden="true"></i>${F.mer.split(" · ")[0]}</small>` : ""}</span>`;
}
addEventListener("resize", () => { clearTimeout(fillSessFig.t); fillSessFig.t = setTimeout(fillSessFig, 120); });
// Avancement : chrono, segment courant qui se remplit, temps total restant.
function updateRing(){
 if (!SS || SS.phase === "end") return;
 const bar = SS.el.querySelector(".sg-bar"); if (bar){ const f = SS.len > 0 ? Math.min(1, Math.max(0, 1 - SS.remaining / SS.len)) : 0; bar.firstChild.style.transform = `scaleX(${f.toFixed(4)})`; bar.setAttribute("aria-valuenow", Math.round(f * 100)); }
 const st = SS.steps[SS.i], done = (SS.phase === "press" ? pauseOf(st, SU.opts) : 0) + (SS.len - SS.remaining);
 const seg = SS.el.querySelectorAll(".sg-segs i")[SS.i]; if (seg) seg.firstChild.style.width = Math.min(100, done / stepLen(st) * 100) + "%";
}
function tick(){
 if (!SS) return;
 if (!document.body.contains(SS.el)) return stopSession();
 if (SS.paused || SS.phase === "end") return;
 SS.remaining = Math.max(0, (SS.end - Date.now()) / 1000);
 updateRing();
 if (SS.remaining > 0) return;
 if (SS.phase === "find") enterPhase("press");
 else { signal(SU.opts.signal, 2); goStep(SS.i + 1); }
}
function goStep(i){
 if (i >= SS.steps.length){
  SS.phase = "end"; SS.paused = false; SS.dur = Math.round((Date.now() - SS.t0) / 1000);
  keepAwake(false); ambStop(5); renderPlayer(); SS.el.scrollTop = 0; return;
 }
 SS.i = Math.max(0, i); SS.paused = false;
 enterPhase("find");
 SS.el.scrollTop = 0;
}
function stopSession(){
 if (!SS) return;
 clearInterval(SS.timer); keepAwake(false); ambStop(.8); SS = null; mediaRelease();
}
function playAction(t){
 const a = t.dataset.s;
 if (a === "toggle"){
  if (SS.paused){ SS.paused = false; SS.end = Date.now() + SS.remaining * 1000; keepAwake(true); }
  else { SS.remaining = Math.max(0, (SS.end - Date.now()) / 1000); SS.paused = true; }
  updateStatus(true); const b = SS.el.querySelector(".sg-play"); b && b.focus({preventScroll:true}); return;
 }
 if (a === "mute"){ ambMute(!SND.muted); const m = SS.el.querySelector('[data-s="mute"]'); if (m){ m.innerHTML = msi(SND.muted ? "volume_off" : "volume_up"); m.setAttribute("aria-pressed", SND.muted); m.setAttribute("aria-label", SND.muted ? "Remettre le son" : "Couper le son"); } return; }
 if (a === "plus15"){ SS.len += 15; SS.remaining += 15; if (!SS.paused) SS.end += 15000; updateRing(); return; }
 if (a === "ready") return enterPhase("press");
 if (a === "next") return goStep(SS.i + 1);
 if (a === "prev") return goStep(SS.phase === "press" && SS.len - SS.remaining > 3 ? SS.i : SS.i - 1);
 if (a === "rate"){ SS.after = SS.after === +t.dataset.v ? null : +t.dataset.v; renderPlayer(); return; }
 if (a === "restart"){ SS.t0 = Date.now(); SS.after = null; ambStart(SU.opts.amb, 3); keepAwake(true); goStep(0); return; }
 if (a === "done"){
  S.hist.push({t:Date.now(), ref:SU.ref, name:SU.it.name, dur:SS.dur, n:new Set(SS.steps.map(x => x.id)).size, before:SU.before, after:SS.after});
  S.hist = S.hist.slice(-50); save();
  stopSession(); pop(); pop(); return;
 }
}
function endHTML(){
 const n = new Set(SS.steps.map(x => x.id)).size, b = SU.before, a = SS.after;
 const cmp = b != null && a != null
  ? `<div class="se-cmp"><span><small>Avant</small><b>${b}</b></span>${msi("arrow_forward")}<span><small>Après</small><b>${a}</b></span></div><p class="grp-foot" style="text-align:center">${a < b ? `Votre gêne a baissé de ${b - a} point${b - a > 1 ? "s" : ""}.` : a > b ? "Votre gêne a augmenté. Essayez une pression plus douce la prochaine fois." : "Votre gêne n'a pas changé."}</p>`
  : b != null ? `<p class="grp-foot" style="text-align:center">Avant la séance : ${b} sur 10</p>` : "";
 return `<article class="detail se sg-end">
  <div class="sg-end-hero"><span class="sg-end-ic">${msi("spa", true)}</span>
   <h1>Séance terminée</h1><p>Prenez un instant. Restez assis une minute, respirez calmement avant de vous lever.</p></div>
  <div class="sg-stats"><div><b>${n}</b><span>point${n > 1 ? "s" : ""}</span></div><div><b>${SS.steps.length}</b><span>étape${SS.steps.length > 1 ? "s" : ""}</span></div><div><b>${fmtTotal(SS.dur)}</b><span>en tout</span></div></div>
  <h3 class="grp-t">Votre gêne maintenant · facultatif</h3>
  <div class="grp"><div class="grp-row col">${scale("after", a)}<span class="grp-sub">0 = aucune gêne, 10 = la pire possible. Gardée dans Profil pour suivre vos séances.</span></div></div>
  ${cmp}
 </article>
 <div class="sx-dock two"><button class="btn btn-soft btn-go" data-s="restart">${msi("replay")}Recommencer</button><button class="btn btn-primary btn-go" data-s="done">Terminer</button></div>`;
}
function histHTML(){
 if (!S.hist.length) return `<div class="list-card" style="padding:16px;color:var(--muted);font-size:.9375rem">Vos séances guidées apparaîtront ici, avec la gêne avant et après.</div>`;
 const rows = S.hist.slice().reverse().slice(0, 12).map(h => {
  const d = new Date(h.t);
  const when = d.toLocaleDateString("fr-CH", {day:"numeric", month:"short"}) + " · " + d.toLocaleTimeString("fr-CH", {hour:"2-digit", minute:"2-digit"});
  const g = h.before != null && h.after != null ? ` · gêne ${h.before} → ${h.after}` : h.after != null ? ` · gêne après : ${h.after}/10` : "";
  const brh = h.ref.startsWith("breath:");
  return `<li><button class="lrow" ${brh ? `data-breath="${h.ref.slice(7)}"` : `data-sym="${h.ref}"`}><span class="hist-ic">${msi(brh ? "air" : "history")}</span><span><b>${h.name}</b><small>${when} · ${fmtTotal(h.dur)}${g}</small></span>${CHEV}</button></li>`;
 }).join("");
 return `<div class="list-card"><ul class="rows">${rows}</ul></div><button class="btn-link hist-clear" data-act="hist-clear">Effacer l'historique</button>`;
}

// ─────────────────────────────────────────────────────────────
// Respiration guidée (cohérence cardiaque).
// Deux écrans : les réglages (rythme, durée, son), puis la séance,
// où une grande sphère monte à l'inspiration et descend à
// l'expiration. Un coup de bol bref marque chaque changement ; tout
// se coupe net à l'arrêt ou en quittant la page.
// ─────────────────────────────────────────────────────────────
const BR_MODES = [
 ["equilibrer", "Équilibrer", 5, 5],
 ["apaiser", "Apaiser", 4, 8],
 ["custom", "Sur mesure", null, null]
];
const BR_SEC_MIN = 60, BR_SEC_MAX = 1800, BR_LEAD = 3500;
let BR = null;

function breathOpts(){
 const b = Object.assign({mode:"equilibrer", inh:5, exh:5, secs:300, sound:true}, S.breath || {});
 if (!BR_MODES.some(m => m[0] === b.mode)) b.mode = "equilibrer";
 b.secs = Math.max(BR_SEC_MIN, Math.min(BR_SEC_MAX, Math.round((+b.secs || 300) / 30) * 30));
 if (typeof b.sound !== "boolean") b.sound = b.tone !== "none";
 delete b.min; delete b.tone;
 return b;
}
function breathRhythm(o){
 const m = BR_MODES.find(x => x[0] === o.mode);
 return m[2] ? {name:m[1], inh:m[2], exh:m[3]} : {name:m[1], inh:o.inh, exh:o.exh};
}
const brPerMin = r => { const v = 60 / (r.inh + r.exh); return (Math.round(v * 10) / 10).toString().replace(".", ","); };
const brEase = p => .5 - Math.cos(Math.PI * Math.max(0, Math.min(1, p))) / 2;
const brDur = s => `${Math.floor(s / 60)} min${s % 60 ? " 30" : ""}`;

function openBreath(mode){
 audioInit(); loadSample("bowl-cue").catch(() => {});
 const o = breathOpts(); if (mode) o.mode = mode;
 BR = {o, state:"idle", t0:0, pausedT:0, total:0, phase:null, cycles:0, raf:0, timer:0, el:null};
 BR.el = push(breathHTML(), el => { el.dataset.breath = "1"; el.classList.add("breath"); }, "modal");
 BR.raf = requestAnimationFrame(brFrame);
 BR.timer = setInterval(brTick, 50);
}
function brSave(){ S.breath = {...BR.o}; save(); }
const closeBtn = () => `<button class="mbar-ic" data-act="back" aria-label="Fermer">${msi("close")}</button>`;

// ── Écran 1 : réglages ───────────────────────────────────────
function setupBreathHTML(){
 const o = BR.o, r = breathRhythm(o), custom = o.mode === "custom";
 const cell = (k, label, ic, v, lo, hi) => `<div class="rhy-cell">
   <span class="rhy-top">${msi(ic)}<span>${label}</span></span>
   ${custom
    ? `<span class="rhy-adj"><button data-b="adj" data-k="${k}" data-d="-1" aria-label="${label} : moins" ${v > lo ? "" : "disabled"}>${msi("remove")}</button><b>${v} s</b><button data-b="adj" data-k="${k}" data-d="1" aria-label="${label} : plus" ${v < hi ? "" : "disabled"}>${msi("add")}</button></span>`
    : `<b class="rhy-v">${v} s</b>`}
  </div>`;
 return `${modalBar("Respiration", closeBtn(), `<button class="mbar-ic" data-b="info" aria-label="Pourquoi ça marche">${msi("info")}</button>`)}
 <article class="detail brs">
  <p class="eyebrow">Cohérence cardiaque</p>
  <h1 class="h1d">Respiration guidée</h1>
  <p class="sub">Respirez au rythme de la sphère : elle monte quand vous inspirez, elle descend quand vous expirez.</p>

  <h3 class="grp-t">Rythme</h3>
  <div class="grp"><div class="grp-row col">
   <div class="segc" role="radiogroup" aria-label="Rythme">${BR_MODES.map(([k, n]) => `<button role="radio" data-b="mode" data-v="${k}" aria-checked="${o.mode === k}">${n}</button>`).join("")}</div>
   <div class="rhy">${cell("inh", "Inspirer", "arrow_upward", r.inh, 2, 10)}${cell("exh", "Expirer", "arrow_downward", r.exh, 2, 12)}</div>
   <div class="rhy-bar" aria-hidden="true"><i style="flex:${r.inh}"></i><i style="flex:${r.exh}"></i></div>
   <p class="rhy-note">${brPerMin(r)} respirations par minute</p>
  </div></div>

  <h3 class="grp-t">Séance</h3>
  <div class="grp">
   <div class="grp-row brs-line"><span><b>Durée</b><small>Par 30 secondes</small></span>
    <span class="brs-step"><button data-b="dur" data-d="-30" aria-label="30 secondes de moins" ${o.secs > BR_SEC_MIN ? "" : "disabled"}>${msi("remove")}</button><b aria-live="polite">${brDur(o.secs)}</b><button data-b="dur" data-d="30" aria-label="30 secondes de plus" ${o.secs < BR_SEC_MAX ? "" : "disabled"}>${msi("add")}</button></span></div>
   <div class="grp-row brs-line"><span><b>Son guide</b><small>Un coup de bol à chaque changement</small></span>
    <button class="switch" role="switch" data-b="sound" aria-checked="${o.sound}" aria-label="Son guide"></button></div>
  </div>
 </article>
 <div class="sx-dock"><button class="btn btn-primary btn-go" data-b="start">${msi("play_arrow", true)}Lancer la séance</button></div>`;
}

// ── Écran 2 : séance ─────────────────────────────────────────
function runBreathHTML(){
 const r = BR.r, st = BR.state;
 if (st === "done"){
  return `${modalBar("Respiration", closeBtn())}
  <div class="brp">
   <div class="brp-stage brp-end">
    <span class="brp-ok">${msi("check_circle", true)}</span>
    <h1 class="h1d">Séance terminée</h1>
    <div class="sx-sum"><span><b>${fmtTotal(Math.round(BR.doneT / 1000))}</b></span><span><b>${BR.cycles}</b> respiration${BR.cycles > 1 ? "s" : ""}</span></div>
    <p class="sub">Reprenez une respiration naturelle avant de vous lever.</p>
   </div>
   <div class="brp-dock two"><button class="btn btn-soft btn-go" data-b="again">${msi("replay")}Recommencer</button><button class="btn btn-primary btn-go" data-b="close">Terminer</button></div>
  </div>`;
 }
 const paused = st === "paused";
 return `${modalBar(`${r.name} · ${r.inh}–${r.exh} s`, closeBtn())}
 <div class="brp">
  <div class="brp-stage"><div class="br-track"><div class="br-glow"></div><div class="br-ball"></div></div></div>
  <div class="brp-dock">
   <button class="brp-btn" data-b="stop" aria-label="Arrêter la séance"><span class="brp-ic">${msi("stop", true)}</span><span>Arrêter</span></button>
   <div class="brp-time"><b class="br-rem">${brView().rem}</b><small>${paused ? "en pause" : "restantes"}</small></div>
   <button class="brp-btn main" data-b="pause" aria-label="${paused ? "Reprendre" : "Pause"}"><span class="brp-ic">${msi(paused ? "play_arrow" : "pause", true)}</span><span>${paused ? "Reprendre" : "Pause"}</span></button>
  </div>
 </div>`;
}
const breathHTML = () => BR.state === "idle" ? setupBreathHTML() : runBreathHTML();
function brRender(){ BR.el.innerHTML = breathHTML(); }

// État courant : position de la sphère (0 en bas, 1 en haut) et temps restant
function brElapsed(){ return BR.state === "paused" ? BR.pausedT : performance.now() - BR.t0; }
function brView(){
 const t = brElapsed(), r = BR.r || breathRhythm(BR.o), cyc = (r.inh + r.exh) * 1000;
 if (t < 0) return {lead:true, y:.5 - .5 * brEase(1 + t / BR_LEAD), rem:fmtClock(BR.total / 1000)};
 const tc = t % cyc, inPh = tc < r.inh * 1000;
 const y = inPh ? brEase(tc / (r.inh * 1000)) : 1 - brEase((tc - r.inh * 1000) / (r.exh * 1000));
 return {lead:false, ph: inPh ? "in" : "out", y, rem: fmtClock(Math.max(0, BR.total - t) / 1000)};
}

// ── Déroulé ──────────────────────────────────────────────────
function brStart(){
 audioInit(); loadSample("bowl-cue").catch(() => {});
 const r = breathRhythm(BR.o), cyc = (r.inh + r.exh) * 1000;
 BR.r = r; BR.total = Math.ceil(BR.o.secs * 1000 / cyc) * cyc;
 BR.state = "run"; BR.t0 = performance.now() + BR_LEAD; BR.phase = null; BR.cycles = 0;
 brRender(); keepAwake(true);
 BR.el.scrollTop = 0;
}
function brTick(){
 if (!BR) return;
 if (!document.body.contains(BR.el)) return brStop();
 if (BR.state !== "run") return;
 const t = brElapsed();
 if (t >= BR.total){ brFinish(BR.total); return; }
 const v = brView();
 if (!v.lead && v.ph !== BR.phase){ BR.phase = v.ph; if (v.ph === "in") BR.cycles++; brCue(v.ph); }
 const rem = BR.el.querySelector(".br-rem"); if (rem && rem.textContent !== v.rem) rem.textContent = v.rem;
}
function brFrame(){
 if (!BR) return;
 if (!document.body.contains(BR.el)) return;
 if (BR.state === "run" || BR.state === "paused"){
  const tr = BR.el.querySelector(".br-track"), ball = BR.el.querySelector(".br-ball"), glow = BR.el.querySelector(".br-glow");
  if (tr && ball){
   const y = brView().y, H = tr.clientHeight, D = ball.offsetWidth, pad = (tr.clientWidth - D) / 2;
   const top = pad + (1 - y) * (H - D - pad * 2);
   ball.style.transform = `translate3d(0,${top}px,0) scale(${.95 + y * .08})`;
   if (glow){ glow.style.transform = `translate3d(0,${top}px,0) scale(${1 + y * .45})`; glow.style.opacity = String(.25 + y * .5); }
  }
 }
 BR.raf = requestAnimationFrame(brFrame);
}
// Coup de bol bref et mat : le même bol, un peu plus grave à l'expiration.
function brCue(ph){
 if (navigator.vibrate) { try { navigator.vibrate(20); } catch(e) {} }
 if (!BR.o.sound || !SND.ac) return;
 const ac = SND.ac, t = ac.currentTime + .01, dest = bus("brBus"), b = SND.files["bowl-cue"];
 try {
  if (b && !(b instanceof Promise)){
   const s = ac.createBufferSource(), g = ac.createGain();
   s.buffer = b; s.playbackRate.value = ph === "in" ? 1 : .794;
   g.gain.value = ph === "in" ? .8 : .9;
   s.connect(g); g.connect(dest); s.start(t);
  } else {
   const f = ph === "in" ? 225 : 178.6;
   [[1, 1, 1.6], [1.99, .35, .9], [3.22, .12, .5]].forEach(([k, a, d]) => tone(dest, f * k, t, d, .2 * a, "sine", .006));
  }
 } catch(e) {}
}
function brHush(){ hushBus("brBus"); }
function brFinish(t){
 BR.doneT = t; BR.state = "done"; keepAwake(false);
 brHush(); mediaRelease();
 if (t >= 60000){
  S.hist.push({t:Date.now(), ref:"breath:" + BR.o.mode, name:"Respiration · " + breathRhythm(BR.o).name, dur:Math.round(t / 1000), n:0});
  S.hist = S.hist.slice(-50); save();
 }
 brRender();
}
function brStop(){
 if (!BR) return;
 clearInterval(BR.timer); cancelAnimationFrame(BR.raf); keepAwake(false); brHush(); BR = null; mediaRelease();
}
function breathAction(t){
 const a = t.dataset.b, o = BR.o;
 const refocus = sel => { const f = BR.el.querySelector(sel); f && !f.disabled && f.focus({preventScroll:true}); };
 const keep = fn => { const y = BR.el.scrollTop; fn(); brSave(); brRender(); BR.el.scrollTop = y; };
 if (a === "mode") return keep(() => { o.mode = t.dataset.v; }), refocus(`[data-b="mode"][data-v="${o.mode}"]`);
 if (a === "adj"){ const k = t.dataset.k, d = +t.dataset.d; keep(() => { o[k] = Math.max(2, Math.min(k === "inh" ? 10 : 12, o[k] + d)); }); return refocus(`[data-b="adj"][data-k="${k}"][data-d="${d}"]`); }
 if (a === "dur"){ keep(() => { o.secs = Math.max(BR_SEC_MIN, Math.min(BR_SEC_MAX, o.secs + +t.dataset.d)); }); return refocus(`[data-b="dur"][data-d="${t.dataset.d}"]`); }
 if (a === "sound"){
  keep(() => { o.sound = !o.sound; }); refocus('[data-b="sound"]');
  if (o.sound){ audioInit(); loadSample("bowl-cue").then(() => brCue("in")).catch(() => brCue("in")); }
  return;
 }
 if (a === "start") return brStart();
 if (a === "pause"){
  if (BR.state === "run"){ BR.pausedT = brElapsed(); BR.state = "paused"; keepAwake(false); brHush(); }
  else { BR.t0 = performance.now() - BR.pausedT; BR.state = "run"; keepAwake(true); }
  brRender(); brTick(); refocus('[data-b="pause"]'); return;
 }
 if (a === "stop") return brFinish(Math.max(0, brElapsed()));
 if (a === "again"){ BR.state = "idle"; brRender(); return; }
 if (a === "close"){ pop(); return; }
 if (a === "info") return openBreathInfo();
}

// ─────────────────────────────────────────────────────────────
// Application
// Modèle de navigation unique : 5 onglets ; chaque onglet a un
// grand titre et un contenu ; tout ce qu'on ouvre arrive en page
// poussée avec la même barre « Retour ».
// ─────────────────────────────────────────────────────────────
const MER = Object.fromEntries(MERIDIANS.map(m => [m.k, m]));
const ORDER = MERIDIANS.map(m => m.k);
const BY = Object.fromEntries(POINTS.map(p => [p.id, p]));
POINTS.sort((a,b) => ORDER.indexOf(a.m) - ORDER.indexOf(b.m) || a.n - b.n);

const S = { tab:"symptomes", mview:"meridiens", zone:"tete", searching:false, q:"", reg:"tous", preg:false, favs:[], sex:"", sess:null, hist:[], theme:"auto", breath:null };
try { const s = JSON.parse(localStorage.getItem("acu-v3") || localStorage.getItem("acu-v2") || "{}"); S.preg = !!s.preg; S.favs = Array.isArray(s.favs) ? s.favs : []; S.sex = s.sex === "h" || s.sex === "f" ? s.sex : ""; S.sess = s.sess && typeof s.sess === "object" ? s.sess : null; S.hist = Array.isArray(s.hist) ? s.hist : []; S.theme = ["light","dark"].includes(s.theme) ? s.theme : "auto"; S.breath = s.breath && typeof s.breath === "object" ? s.breath : null; } catch(e) {}
function save(){ try { localStorage.setItem("acu-v3", JSON.stringify({preg:S.preg, favs:S.favs, sex:S.sex, sess:S.sess, hist:S.hist, theme:S.theme, breath:S.breath})); } catch(e) {} }

function applyTheme(){ const r = document.documentElement; if (S.theme === "light" || S.theme === "dark") r.dataset.theme = S.theme; else delete r.dataset.theme; }
const THEMES = [["auto","Auto","brightness_auto"],["light","Clair","light_mode"],["dark","Sombre","dark_mode"]];
const segBtns = (attr, vals, cur, label) => `<div class="segc" role="radiogroup" aria-label="${label}">${vals.map(([v, t, ic]) => `<button role="radio" data-${attr}="${v}" aria-checked="${cur === v}">${ic ? `<span class="msi" aria-hidden="true">${ic}</span>` : ""}${t}</button>`).join("")}</div>`;
const $ = s => document.querySelector(s);
const elVar = m => `--el:var(--${MER[m].el})`;
const code = p => p.m === "EX" ? p.fr : (p.code ? p.code.split(" · ")[0] : `${MER[p.m].fr} ${p.n}`);
const who = p => p.m === "EX" ? p.code : (p.code ? p.code.split(" · ").slice(1).join(" · ") || p.id : `${p.m}${p.n}`);
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const bilateral = p => p.bi !== false && p.m !== "GV" && p.m !== "CV";
const NSYM = SYMPTOMS.reduce((a,c) => a + c.items.length, 0);

// Pictogrammes : Google Material Symbols (police), sans retouche.
const IC = {search:"search", back:"arrow_back_ios_new", chev:"chevron_right", star:"star", info:"info", warn:"warning"};
const svgi = (k, s=20, sw=2, fill="none") => `<span class="msi${fill !== "none" ? " msi-fill" : ""}" style="font-size:${Math.round(s*1.1)}px" aria-hidden="true">${IC[k]}</span>`;
const icon = (k, size=26) => `<span class="msi" style="font-size:${size+4}px" aria-hidden="true">${ICONS[k]}</span>`;
const CHEV = `<span class="chev">${svgi("chev", 16, 2.2)}</span>`;

// ── Coordonnées ──────────────────────────────────────────────
function inView(p, v){ return p.v === v || (p.d && p.d.v === v); }
function spot(p, v){ // position du point dans la vue v
 if (p.d && p.d.v === v) return {x:p.d.x, y:p.d.y, pts:p.d.pts};
 return {x:p.x, y:p.y, pts:p.pts};
}
function mainView(p){ return p.d ? p.d.v : p.v; }
function coordsOf(p, v){
 const s = spot(p, v);
 const base = s.pts || [[s.x, s.y]];
 const all = base.map(([x,y],i) => ({x, y, main:i===0}));
 if ((v === "front" || v === "back") && bilateral(p) && !(p.d && p.d.v === v)) base.forEach(([x,y]) => all.push({x:400-x, y, main:false, mir:true}));
 return all;
}
function zoomFor(p, v){
 if (v === "armP" || v === "armD") return 270;
 if (v === "sole") return 300;
 if (v === "medial") return 230;
 if (p.reg === "tete") return 118;
 if (p.reg === "bras") return p.y > 520 ? 92 : 150;
 if (p.reg === "jambe") return (p.y > 900 && v !== "side") ? 96 : 170;
 return 175;
}

/* o: v, box, items:[{p, kind:'on'|'tap'|'dim', label}], path, px, maxH, lm, cun */
function figure(o){
 const [bx,by,bw,bh] = o.box;
 const px = o.px || Math.min(380, innerWidth - 66);
 const maxH = o.maxH || Math.max(320, innerHeight * 0.6);
 const sc = Math.min(px / bw, maxH / bh);
 const u = 1 / sc;
 const wide = (o.v === "front" || o.v === "back") && bw >= 200;
 let g = landmarkLayer(o.v, o.lm || null, u, o.lmLabels !== false, o.box);
 if (o.path && o.path.pts.length > 1){
  const d = o.path.pts.map((q,i) => (i ? "L" : "M") + q[0] + " " + q[1]).join(" ");
  g += `<path class="mpath" d="${d}" style="stroke:${o.path.color}"/>`;
  if (o.path.mirror) g += `<path class="mpath" d="${d}" transform="matrix(-1 0 0 1 400 0)" style="stroke:${o.path.color};opacity:.3"/>`;
 }
 if (o.cun){
  const [ax,ay] = o.cun.a, [qx,qy] = o.cun.b;
  let dx = qx-ax, dy = qy-ay; const L = Math.hypot(dx,dy) || 1; dx/=L; dy/=L;
  let nx = -dy, ny = dx; if (nx < 0 || (Math.abs(nx) < .01 && ny > 0)) { nx = -nx; ny = -ny; }
  const off = 26*u, t = 6*u;
  const A = [ax+nx*off, ay+ny*off], B = [qx+nx*off, qy+ny*off];
  g += `<path class="cun-d" d="M${ax} ${ay} L${A[0]} ${A[1]} M${qx} ${qy} L${B[0]} ${B[1]}"/>`;
  g += `<path class="cun-l" d="M${A[0]} ${A[1]} L${B[0]} ${B[1]} M${A[0]-dx*0+nx*-t} ${A[1]+ny*-t} L${A[0]+nx*t} ${A[1]+ny*t} M${B[0]-nx*t} ${B[1]-ny*t} L${B[0]+nx*t} ${B[1]+ny*t}"/>`;
  const mx = (A[0]+B[0])/2 + nx*10*u, my = (A[1]+B[1])/2 + ny*10*u;
  const [c1, c2] = o.cun.t.split(" · ");
  g += `<text class="cun-t" x="${mx}" y="${my}" text-anchor="${nx >= 0 ? "start" : "end"}" style="font-size:${12*u}px;stroke-width:${3.5*u}px">${c1}<tspan x="${mx}" dy="${14*u}" style="font-weight:500">${c2 || ""}</tspan></text>`;
 }
 let labels = "";
 for (const it of o.items){
  const p = it.p;
  for (const c of coordsOf(p, o.v)){
   if (it.only && (it.only === "mirror") !== !!c.mir) continue;
   if (c.x < bx - 10 || c.x > bx + bw + 10 || c.y < by - 10 || c.y > by + bh + 10) continue;
   if (it.kind === "on"){
    g += `<circle class="halo" cx="${c.x}" cy="${c.y}" r="${6*u}"/><circle class="mk-on" cx="${c.x}" cy="${c.y}" r="${6.5*u}"/>`;
   } else if (it.kind === "dim"){
    g += `<circle class="mk-dim" cx="${c.x}" cy="${c.y}" r="${3.2*u}"/>`;
   } else {
    g += `<g class="tap" data-id="${p.id}" tabindex="0" role="button" aria-label="${code(p)} ${p.py}"><circle class="hit" cx="${c.x}" cy="${c.y}" r="${15*u}"/><circle class="mk" cx="${c.x}" cy="${c.y}" r="${5.2*u}"/></g>`;
   }
   if (it.label && c.main){
    const fs = 12*u, ls = p.ls;
    let tx, ty = c.y + fs*0.36, anchor;
    if (ls === "b"){ tx = c.x; ty = c.y + fs*1.5; anchor = "middle"; }
    else {
     const left = ls ? ls === "l" : wide ? c.x < 200 : (c.x - bx) > (bx + bw - c.x);
     tx = c.x + (left ? -10*u : 10*u); anchor = left ? "end" : "start";
    }
    const txt = p.lb || code(p);
    if (it.kind === "on"){
     const w = txt.length * fs * 0.62 + 14*u, h = fs + 10*u;
     const rx0 = anchor === "end" ? tx - w + 4*u : anchor === "middle" ? tx - w/2 : tx - 4*u;
     const ry0 = ty - fs*0.85 - 5*u + fs*0.1;
     labels += `<rect class="pill" x="${rx0}" y="${ry0}" width="${w}" height="${h}" rx="${h/2}"/><text class="pill-t" x="${rx0 + w/2}" y="${ry0 + h/2 + fs*0.35}" text-anchor="middle" style="font-size:${fs}px">${txt}</text>`;
    } else {
     labels += `<text class="mk-lbl" x="${tx}" y="${ty}" text-anchor="${anchor}" style="font-size:${fs}px;stroke-width:${3.5*u}px">${txt}</text>`;
    }
   }
  }
 }
 return `<svg class="fig figbox" viewBox="${bx} ${by} ${bw} ${bh}" style="height:${Math.round(bh*sc)}px" role="img" aria-label="Schéma : ${BASE[o.v].label}">${figureLayers(o.v)}${g}${labels}</svg>`;
}

// ── Listes ───────────────────────────────────────────────────
function match(p){
 if (!S.searching && S.reg !== "tous" && p.reg !== S.reg) return false;
 const q = norm(S.q.trim()); if (!q) return true;
 const qs = q.replace(/\s+/g, "");
 if (norm(code(p)).replace(/\s/g,"") === qs || p.id.toLowerCase() === qs) return true;
 const hay = norm([code(p), who(p), p.id, p.py, p.hz, p.tr, MER[p.m].name, p.fn.join(" "), p.ind, p.cat.join(" ")].join(" "));
 return q.split(/\s+/).every(w => hay.includes(w));
}
function row(p){
 const preg = S.preg && p.preg === "ci";
 return `<li><button class="row" data-id="${p.id}">
  <span class="code" style="${elVar(p.m)}">${code(p)}</span>
  <span style="min-width:0"><span class="t1"><span class="py">${p.py}</span><span class="hz han">${p.hz}</span></span>
  <span class="t2">${p.tr}</span></span>
  <span class="end">${preg ? '<span class="badge-preg">Grossesse</span>' : ''}${S.favs.includes(p.id) ? '<span class="star" aria-label="Gardé">★</span>' : ''}${CHEV}</span>
 </button></li>`;
}
function grouped(pts){
 let h = "";
 for (const k of ORDER){
  const g = pts.filter(p => p.m === k); if (!g.length) continue;
  const m = MER[k];
  h += `<div class="ghead" style="${elVar(k)}"><i class="dot"></i><b>${m.name}</b><span>${m.k === "EX" ? "" : m.fr + " · " + m.k}</span></div><div class="list-card"><ul class="rows">${g.map(row).join("")}</ul></div>`;
 }
 return h;
}
function listHTML(){
 const pts = POINTS.filter(match);
 if (!pts.length) return `<p class="empty">Aucun point ne correspond à « ${S.q.replace(/</g,"&lt;")} ».<br>Essayez un nom, un code (GI 4 ou LI4) ou un mot comme « sommeil ».</p>`;
 return grouped(pts);
}

// ── Onglet Symptômes ─────────────────────────────────────────
function tint(k){ return `--tc:var(--c-${k})`; }
function screenSymptomes(){
 return `<header class="appbar"><h1>Symptômes</h1></header>
 <p class="lead">Choisissez ce que vous ressentez : l'app vous montre où presser.</p>

// ── Onglet Méridiens (méridiens + tous les points) ───────────
function screenMeridians(){
 if (S.searching){
  return `<header class="searchhead">
   <label class="search">${svgi("search")}<input id="q" type="search" enterkeyhint="search" placeholder="Nom, code, mot-clé…" value="${S.q.replace(/"/g,"&quot;")}" autocomplete="off" aria-label="Rechercher un point"></label>
   <button class="cancel" data-act="search-off">Annuler</button></header>

 }
 const seg = `<div class="seg utabs" role="group" aria-label="Affichage"><button data-mview="meridiens" aria-pressed="${S.mview==="meridiens"}">Méridiens</button><button data-mview="carte" aria-pressed="${S.mview==="carte"}">Carte</button><button data-mview="points" aria-pressed="${S.mview==="points"}">Tous les points</button></div>`;

 } else if (S.mview === "carte"){

 } else {

  body = groups.map(([t, ms], gi) => `<div class="${gi ? "sect" : ""}"><div class="sect-t">${t}</div><div class="list-card"><ul class="rows">${ms.map(m => {

   return `<li><button class="lrow" data-mer="${m.k}" style="${elVar(m.k)}"><span class="glyph">${m.fr}</span><span><b>${m.name}</b><small>${sub}</small></span><span class="cnt"><span class="badge">${n}</span>${CHEV}</span></button></li>`;
  }).join("")}</ul></div></div>`).join("");
 }
 return `<header class="appbar"><h1>Méridiens</h1><button class="iconbtn" data-act="search-on" aria-label="Rechercher un point">${svgi("search",22,2.2)}</button></header>
 <p class="lead">Selon la médecine chinoise, l'énergie circule dans des canaux : les méridiens. Voici les méridiens et leurs ${POINTS.length} points.</p>
 ${seg}${body}`;
}

// Carte du corps : les points d'une zone, sur les planches
function screenMap(){
 const z = ZONES.find(x => x.k === S.zone) || ZONES[0];
 const pts = POINTS.filter(p => p.reg === z.k);
 const w = Math.min(640, innerWidth) - 32;
 let h = "";
 for (const {V, items} of plCover(pts)){
  // tous les points de la zone visibles dans cette vue
  const all = (plViewsFor(pts)[V.vid] || items);
  const F = plMapFig(V, all, {w, minFrac:.3});
  h += `<figure class="card figcard pfig mfig">${F.html}<figcaption class="pl-cap"><b>${F.cap}</b><span>${all.length} point${all.length > 1 ? "s" : ""}</span></figcaption></figure>`;
 }
 // ancien schéma : seulement les vues qui ont encore des points sans planche
 for (const mk of z.maps){
  const mp = MAPS.find(x => x.k === mk); if (!mp) continue;
  const [bx,by,bw,bh] = mp.box;

}

 syncModal();
 el.classList.add("leave");
 const done = () => el.remove();
 if (matchMedia("(prefers-reduced-motion: reduce)").matches) done(); else setTimeout(done, 340);

}

// ── Parcours d'un protocole, point par point, sans minuteur ──────
// W = {ref, name, ids, i}. La fiche est remplacée sur place : « Retour »
// ramène toujours au protocole en une touche.
function walkOf(ref, id){
 const [ck, sk] = ref.split("/");
 const c = SYMPTOMS.find(x => x.k === ck), it = c && c.items.find(x => x.k === sk);
 if (!it) return null;
 const ids = it.pts.filter(x => BY[x]);
 const i = ids.indexOf(id);
 return i < 0 ? null : {ref, name: it.name, ids, i};
}
const ciMark = p => S.preg && p.preg === "ci";
const wkName = p => `${code(p)} ${p.py}`;
function walkCtx(W){
 const N = W.ids.length;
 return `<div class="wk-ctx">
  <div class="wk-row"><span class="wk-name">${W.name}</span><span class="wk-count">Point ${W.i + 1} sur ${N}</span>${W.i > 0 ? `<button class="wk-first" data-wgo="0" aria-label="Revenir au premier point : ${wkName(BY[W.ids[0]])}"><span class="msi" aria-hidden="true">first_page</span>Début</button>` : ""}</div>
  <div class="wk-segs" role="group" aria-label="Points du protocole">${W.ids.map((id, j) => { const q = BY[id];
   return `<button class="wk-seg${j < W.i ? " done" : j === W.i ? " cur" : ""}${ciMark(q) ? " is-ci" : ""}" data-wgo="${j}" aria-label="Point ${j + 1} : ${wkName(q)}${ciMark(q) ? ", à éviter pendant la grossesse" : ""}"${j === W.i ? ' aria-current="step"' : ""}><i></i></button>`; }).join("")}</div>

 </div>`;
}
function walkEnd(W){
 if (W.i < W.ids.length - 1) return "";
 return `<section class="wk-done"><span class="wk-done-ic"><span class="msi msi-fill" aria-hidden="true">check_circle</span></span>
  <div><b>Vous avez vu les ${W.ids.length} points</b><p>Pour les enchaîner avec un minuteur et un signal sonore, lancez la séance guidée.</p>
  <button class="btn btn-soft wk-sess" data-s="setup" data-ref="${W.ref}"><span class="msi msi-fill" aria-hidden="true">play_arrow</span>Lancer la séance guidée</button></div></section>`;
}
function walkFoot(W){
 const N = W.ids.length, pv = W.i > 0 && BY[W.ids[W.i - 1]], nx = W.i < N - 1 && BY[W.ids[W.i + 1]];
 return `<nav class="wk-foot" aria-label="Parcours du protocole">
  <button class="wk-prev" data-wgo="${W.i - 1}" ${pv ? `aria-label="Point précédent : ${wkName(pv)}"` : "disabled aria-label=\"Pas de point précédent\""}><span class="msi" aria-hidden="true">arrow_back</span>Précédent</button>

   : `<button class="wk-next wk-end" data-act="back" aria-label="Terminer et revenir au protocole"><span class="wk-next-t"><b>Terminer</b></span><span class="msi" aria-hidden="true">check</span></button>`}

}
function openWalk(ref, id){

}
function walkGo(sheet, j, dir){
 const W = walkOf(sheet.dataset.walk, sheet.dataset.point); if (!W) return;
 if (j < 0 || j >= W.ids.length || j === W.i) return;
 W.i = j; const id = W.ids[j];

// Balayage horizontal (hors planche et visionneuse) et flèches du clavier.
function walkBind(el){
 let x0 = 0, y0 = 0, t0 = 0, ok = false;
 el.addEventListener("touchstart", e => {
  const t = e.touches[0]; ok = e.touches.length === 1 && !e.target.closest(".plate, .pl-zoom, .wk-segs, input, .cats");
  x0 = t.clientX; y0 = t.clientY; t0 = Date.now();

 el.addEventListener("touchend", e => {
  if (!ok || !el.dataset.walk) return; ok = false;
  const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.6 || Date.now() - t0 > 700) return;
  const W = walkOf(el.dataset.walk, el.dataset.point); if (!W) return;

  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  if (stack[stack.length - 1] !== el) return;
  const W = walkOf(el.dataset.walk, el.dataset.point); if (!W) return;
  e.preventDefault(); walkGo(el, W.i + (e.key === "ArrowRight" ? 1 : -1));
 });
}

  <section class="sec"><h2>Trajet</h2><p>${m.path}</p></section>
  <section class="sec"><h2>Sur le corps</h2><div class="mfigs">${figs}</div>
   ${m.k === "EX" ? "" : `<p class="fine" style="margin-top:10px">Tracé simplifié, qui relie seulement les points présentés ici.</p>`}</section>
  <section class="sec"><h2>Points du méridien · ${pts.length}</h2><div class="list-card"><ul class="rows">${pts.map(row).join("")}</ul></div></section>
 </article>`);
}
// Planches d'un ensemble de points : planches illustrées d'abord (tracé du
// méridien, cibles de 44 px), puis l'ancien schéma pour les points absents.
function bodyFigs(pts, o){
 const w = Math.min(640, innerWidth) - 32;
 let h = "";
 for (const {V, items} of plCover(pts)){
  const F = plMapFig(V, items, {w, mer: o.path ? o.mer : null, minFrac:o.minFrac});
  h += `<figure class="card figcard pfig mfig">${F.html}<figcaption class="pl-cap"><b>${F.cap}</b><span>${items.length} point${items.length > 1 ? "s" : ""}</span>${merCap(F.mer)}</figcaption></figure>`;
 }
 const old = pts.filter(p => !plMain(p));
 const views = [...new Set(old.map(p => p.v))];
 for (const v of views){
  const vp = old.filter(p => p.v === v);
  const box = meridianBox(v, vp.flatMap(p => p.pts || [[p.x,p.y]]));
  const path = o.path ? {color:o.path, pts: vp.map(p => [p.x,p.y]), mirror: (v==="front"||v==="back") && o.mer!=="GV" && o.mer!=="CV"} : null;
  const loc = oldLocSVG(v, box);
  h += `<figure class="card figcard pfig mfig"><div class="plate plate-old pl-map">${figure({v, box, items: vp.map(p => ({p, kind:"tap", label:true})), path, px:w - 20})}${plLocWrap(loc, "", false)}</div><figcaption class="pl-cap"><b>${BASE[v].label}</b><span>${vp.length} point${vp.length > 1 ? "s" : ""}</span></figcaption></figure>`;
 }
 return h;
}
function meridianBox(v, pts){
 const xs = pts.map(q=>q[0]), ys = pts.map(q=>q[1]);
 let x0 = Math.min(...xs) - 34, x1 = Math.max(...xs) + 34, y0 = Math.min(...ys) - 34, y1 = Math.max(...ys) + 34;
 let w = Math.max(x1-x0, 130), h = Math.max(y1-y0, 130);
 const cx = (x0+x1)/2, cy = (y0+y1)/2, b = BASE[v];
 w = Math.min(w, b.w); h = Math.min(h, b.h);
 return [Math.max(0, Math.min(b.w - w, cx - w/2)), Math.max(0, Math.min(b.h - h, cy - h/2)), w, h];
}

// Catégorie et situation
function breathCard(){
 return `<button class="sess-cta brc-cta" data-breath="${breathOpts().mode}"><span class="sess-cta-ic"><span class="msi" aria-hidden="true">air</span></span><span><b>Respiration guidée</b><small>Cohérence cardiaque · quelques minutes pour se calmer</small></span>${CHEV}</button>
 <h2 class="brc-h">Points d'acupression</h2>`;
}
function openCategory(k){
 const c = SYMPTOMS.find(x => x.k === k); if (!c) return;
 push(`${bar(c.name)}
 <article class="detail">
  <div class="cathead" style="${tint(c.k)}"><span class="tile-ic">${icon(c.k, 30)}</span><h1 class="h1d">${c.name}</h1></div>
  ${c.k === "esprit" ? breathCard() : ""}
  <div class="list-card"><ul class="rows">${c.items.map(it => `<li><button class="lrow" data-sym="${c.k}/${it.k}"><span></span><span><b>${it.name}</b><small>${it.pts.length ? `${it.pts.length} point${it.pts.length>1?"s":""} · ${it.pts.slice(0,4).map(id => code(BY[id])).join(", ")}${it.pts.length>4?"…":""}` : "Conseils pratiques, sans point"}</small></span>${CHEV}</button></li>`).join("")}</ul></div>
 </article>`);
}
function openSymptom(ref){
 const [ck, sk] = ref.split("/");
 const c = SYMPTOMS.find(x => x.k === ck); const it = c && c.items.find(x => x.k === sk); if (!it) return;
 const pts = it.pts.map(id => BY[id]);
 const cw = Math.floor((Math.min(640, innerWidth) - 32 - 12) / 2) - 2;
 const cards = pts.map((p, idx) => {
  const preg = S.preg && p.preg === "ci";
  const F = pointFig(p, {ctx:"card", w:cw, aspect:1, maxH:cw});
  return `<button class="pcard${preg ? " is-ci" : ""}" data-id="${p.id}" data-walk="${ck}/${sk}"><span class="pc-n">${idx+1}</span>${F.html}
   <span class="pc-t"><span class="code" style="${elVar(p.m)}">${code(p)}</span><b>${p.py}</b></span>
   <small class="pc-o">${F.cap}</small>
   <small>${preg ? "À éviter pendant la grossesse" : (bilateral(p) ? "Des deux côtés" : "Sur la ligne du milieu")}</small></button>`;
 }).join("");
 const ci = pts.filter(p => p.preg === "ci");
 const pregNote = S.preg && ci.length ? `<div class="alert" role="alert">${svgi("warn",18,2)}<span>Grossesse : n'utilisez pas ${ci.map(code).join(", ")}.</span></div>` : "";
 const ev = "";
 const care = it.care ? `<div class="care"><span class="msi msi-fill" aria-hidden="true">favorite</span><span>${it.care}</span></div>` : "";
 const warn = c.warn ? `<section class="sec"><h2>Précautions</h2><ul class="warnlist">${c.warn.map(w => `<li>${w}</li>`).join("")}</ul></section>` : "";
 const tips = it.tips ? `<section class="sec"><h2>Ce qui aide vraiment</h2><ul class="tips">${it.tips.map(t => `<li><span class="msi" aria-hidden="true">check_circle</span><span>${t}</span></li>`).join("")}</ul></section>` : "";
 const ptsSec = pts.length ? `<section class="sec"><h2>${it.tips && !it.ptsFirst ? "Pour les effets des médicaments" : "Où presser"} · ${pts.length} point${pts.length>1?"s":""}</h2><div class="pcards">${cards}</div><p class="cap" style="text-align:left">Touchez un point pour savoir comment le trouver.</p></section>` : "";
 const body = it.ptsFirst ? ptsSec + tips + warn
  : it.tips ? tips + ptsSec + (pts.length ? warn : "")
  : (pts.length ? warn : "") + ptsSec;
 const seeDr = it.alert ? `<section class="sec"><h2>Quand consulter</h2><div class="see-dr"><span class="see-dr-ic"><span class="msi" aria-hidden="true">stethoscope</span></span><p>${it.alert}</p></div></section>` : "";
 push(`${bar(it.name)}
 <article class="detail">
  <p class="eyebrow" style="color:var(--c-${c.k})">${c.name}</p>
  <h1 class="h1d">${it.name}</h1>
  <p class="sub">${it.intro}</p>
  ${ev}
  ${pregNote}
  ${care}
  ${pts.length ? `<button class="sess-cta" data-s="setup" data-ref="${ck}/${sk}"><span class="sess-cta-ic"><span class="msi msi-fill" aria-hidden="true">play_arrow</span></span><span><b>Séance guidée</b><small>${pts.length} point${pts.length>1?"s":""} · environ ${fmtTotal(estimate(it))} · avec minuteur</small></span>${CHEV}</button>` : ""}
  ${it.breath ? `<button class="sess-cta brc-cta" data-breath="${it.breath}"><span class="sess-cta-ic"><span class="msi" aria-hidden="true">air</span></span><span><b>Respiration guidée</b><small>Pour apaiser · inspirez 4 secondes, soufflez 8 secondes</small></span>${CHEV}</button>` : ""}
  ${body}
  ${seeDr}
 </article>`);
}

// ── Événements ───────────────────────────────────────────────
function tapKey(e){
 if (e.key !== "Enter" && e.key !== " ") return;
 const g = e.target.closest(".tap"); if (!g) return;
 e.preventDefault(); g.dispatchEvent(new MouseEvent("click", {bubbles:true}));
}
function sheetClick(e){
 const pz = e.target.closest(".plate.pl-sheet, .plate.pl-body");
 if (pz && !e.target.closest(".pl-loc, button, .tap")) return plZoom(pz);
 const t = e.target.closest("button, .tap"); if (!t) return;
 const sheet = e.currentTarget;
 if (t.dataset.act === "back") return pop();
 if (t.dataset.b !== undefined && sheet.dataset.breath){ return BR && breathAction(t); }
 if (t.dataset.breath) return openBreath(t.dataset.breath);
 if (t.dataset.s){
  if (sheet.dataset.sess === "setup") return setupAction(t, sheet);
  if (sheet.dataset.sess === "play") return SS && playAction(t);
  if (t.dataset.s === "setup") return openSetup(t.dataset.ref);
 }
 if (t.dataset.act === "fav") return toggleFav(t);
 if (t.dataset.wgo !== undefined && sheet.dataset.walk) return walkGo(sheet, +t.dataset.wgo);
 if (t.dataset.walk) return openWalk(t.dataset.walk, t.dataset.id);
 if (t.dataset.go) return openPoint(t.dataset.go, true);
 if (t.dataset.act === "body") return openBody(t.dataset.id);
 if (t.dataset.gloss !== undefined){
  const c = BY[sheet.dataset.point].cat[+t.dataset.gloss];
  const box = sheet.querySelector(".gloss");
  const open = t.getAttribute("aria-expanded") === "true";
  sheet.querySelectorAll(".cat").forEach(b => b.setAttribute("aria-expanded","false"));
  if (open){ box.hidden = true; return; }
  const gl = GLOSSARY.find(([re]) => re.test(c));
  box.innerHTML = gl ? `<b>${gl[1]}</b>${gl[2]}` : `<b>${c}</b>`;
  box.hidden = false; t.setAttribute("aria-expanded","true"); return;
 }
 if (t.dataset.sym) return openSymptom(t.dataset.sym);
 if (t.dataset.mer) return openMeridian(t.dataset.mer);
 if (t.dataset.id) return openPoint(t.dataset.id);
}
function toggleFav(btn){
 const id = btn.dataset.id, i = S.favs.indexOf(id);
 if (i >= 0) S.favs.splice(i,1); else S.favs.push(id);
 save();
 const on = S.favs.includes(id);
 btn.setAttribute("aria-pressed", on);
 btn.innerHTML = svgi("star",22,1.8,on ? "currentColor" : "none");
}

function boot(){
 applyTheme();
 let started = false;
 const go = () => { if (started) return; started = true; start(); };
 plLoad().then(() => { if (started){ if (PL.man && !stack.length) render(true); } else go(); });
 setTimeout(go, 1200);
}
function start(){
 mountFigureDefs();
 const scr = $("#screen");
 scr.addEventListener("click", e => {
  const a = e.target.closest("[data-anchor]");
  if (a){ e.preventDefault(); const t = document.getElementById(a.dataset.anchor); t && t.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); return; }
  const t = e.target.closest("button, .tap"); if (!t) return;
  if (t.dataset.acc){ accToggle(t.dataset.acc); return; }
  if (t.dataset.toc){ accGo(t.dataset.toc); return; }
  if (t.dataset.accAll){ accAll(t.dataset.accAll); return; }
  if (t.dataset.mview){ S.mview = t.dataset.mview; render(); return; }
  if (t.dataset.sex){ S.sex = t.dataset.sex; save(); render(true); return; }
  if (t.dataset.thm){ S.theme = t.dataset.thm; save(); applyTheme(); render(true); return; }
  if (t.dataset.act === "sound-test"){ const st = $(".snd-st"); if (st) st.textContent = "Test en cours…"; soundTest(() => { const e = $(".snd-st"); if (e) e.textContent = soundStatus(); }); return; }
  if (t.dataset.reg){ S.reg = t.dataset.reg; render(true); return; }
  if (t.dataset.zone){ S.zone = t.dataset.zone; render(true); return; }
  if (t.dataset.act === "search-on"){ S.searching = true; render(); const q = $("#q"); q && q.focus(); return; }
  if (t.dataset.act === "search-off"){ S.searching = false; S.q = ""; render(); return; }
  if (t.dataset.act === "preg"){ S.preg = !S.preg; save(); render(true); return; }
  if (t.dataset.act === "hist-clear"){ if (confirm("Effacer l'historique des séances ?")){ S.hist = []; save(); render(true); } return; }
  if (t.dataset.sym) return openSymptom(t.dataset.sym);
  if (t.dataset.breath) return openBreath(t.dataset.breath);
  if (t.dataset.cat) return openCategory(t.dataset.cat);
  if (t.dataset.mer) return openMeridian(t.dataset.mer);
  if (t.dataset.id) return openPoint(t.dataset.id);
 });
 scr.addEventListener("keydown", tapKey);
 scr.addEventListener("input", e => {
  if (e.target.id !== "q") return;
  S.q = e.target.value;
  $("#list").innerHTML = S.q.trim() ? listHTML() : `<p class="empty">Tapez le nom d'un point, son code (GI 4, LI4) ou un mot comme « nausée ».</p>`;
 });
 $(".tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  while (stack.length){ stack.pop().remove(); }
  soundHushAll();
  S.tab = b.dataset.tab; S.searching = false; render();
 });
 document.addEventListener("keydown", e => { if (e.key === "Escape" && stack.length) pop(); });
 addEventListener("resize", fitTop);
 addEventListener("orientationchange", () => setTimeout(fitTop, 300));
 const h = location.hash.slice(1);
 if (SCREENS[h]) S.tab = h;
 render();
 if (BY[h]) openPoint(h);
 onboarding();
}
boot();


</script>
