const ICONS = {"tete":"face","grippe":"sick","dos":"skeleton","digestion":"gastroenterology","sommeil":"bedtime","esprit":"psychology","energie":"bolt","femmes":"female","peau":"dermatology","chirurgie":"healing"};

const SYMPTOMS = [
 {k:"tete",name:"Tête & visage",items:[
  {k:"cephalee-front",name:"Mal de tête au front",pts:["GV29","BL2","GB14","LI4","ST41"],intro:"Des points sur le front et autour des sourcils. On y ajoute des points plus loin, sur la main et la cheville, qui agissent à distance.",alert:"Mal de tête brutal et très violent, avec fièvre et raideur de la nuque, avec trouble de la vue ou de la parole, ou après un choc à la tête."},
  {k:"migraine",name:"Migraine, mal de tête sur le côté",pts:["TAIYANG","TE23","GB8","GB20","TE5","GB41","LR3"],ev:"etudes",evtext:"Une synthèse Cochrane (2016, 22 essais, près de 5 000 personnes) montre que l'acupuncture avec aiguilles, en séances régulières, réduit le nombre de crises de migraine : un peu mieux que de faux points, et au moins autant que les médicaments de fond (preuves de qualité moyenne). Pour la simple pression des doigts, il n'existe pas d'étude solide.",intro:"Deux méridiens passent sur la tempe : la Vésicule Biliaire et le Triple Réchauffeur. Commencez par les points de la tempe et de la nuque, puis ceux des mêmes méridiens sur l'avant-bras et le pied. F 3, sur le pied, calme ce qui monte à la tête.",alert:"Mal de tête brutal et très violent, le pire de votre vie : appelez le 144. Première migraine après 50 ans, mal de tête qui change de nature, avec fièvre et nuque raide, trouble de la parole ou de la vue, faiblesse ou engourdissement d'un côté : consultez un médecin sans attendre."},
  {k:"cephalee-nuque",name:"Mal de tête à l'arrière du crâne",pts:["GB20","BL10","GV16","SI3","BL60"],intro:"Des points à la base du crâne. On y ajoute des points sur la main et la cheville, qui agissent à distance sur la nuque.",alert:"Mal de tête avec fièvre et nuque raide, ou après une chute ou un choc."},
  {k:"cephalee-sommet",name:"Mal de tête au sommet du crâne",pts:["GV20","LR3","KI1","BL67"],intro:"Le méridien du Foie monte jusqu'au sommet du crâne. Pressez VG 20, au sommet de la tête, puis des points du pied qui font « redescendre » ce qui monte à la tête.",alert:"Mal de tête brutal et très violent, ou accompagné de vomissements et de confusion."},
  {k:"yeux",name:"Yeux fatigués",pts:["BL1","BL2","TAIYANG","BL10","BL18","SI6"],intro:"Des points autour des yeux, à presser doucement, les yeux fermés. On y ajoute des points sur la nuque, l'avant-bras et le dos.",alert:"Œil rouge et douloureux, baisse soudaine de la vision, éclairs lumineux ou voile devant l'œil."},
  {k:"dents",name:"Mal de dents",pts:["LI4","LI5","ST44","ST7","ST6"],intro:"Pour soulager en attendant le dentiste : des points sur la mâchoire, la main et le pied.",alert:"Joue gonflée, fièvre, difficulté à avaler ou à ouvrir la bouche : consultez rapidement un dentiste."},
  {k:"machoire",name:"Mâchoire tendue, grincement des dents",pts:["ST6","ST7","GB2","TE17","LI4"],intro:"Des points sur le muscle qui serre les dents, et autour de l'articulation de la mâchoire, devant et derrière l'oreille.",alert:"Mâchoire bloquée ou douleur après un choc."},
  {k:"oreilles",name:"Sifflements d'oreille (acouphènes)",pts:["SI19","GB2","TE17","BL23","TE3","TE5","KI3"],intro:"Des points devant et derrière l'oreille, et sur la main. On y ajoute deux points que la tradition relie aux oreilles : R 3, à la cheville, et V 23, dans le bas du dos.",alert:"Baisse soudaine de l'audition d'un côté : consultez un médecin ORL dans les 24 à 48 heures. Sifflement d'un seul côté qui dure, sifflement qui bat au rythme du cœur, ou avec des vertiges : parlez-en à votre médecin."},
  {k:"vertiges",name:"Vertiges",pts:["GV20","SISHENCONG","ANMIAN","GB20","PC6","ST40","BL62"],intro:"Des points au sommet du crâne et sur la nuque. MC 6, au poignet, calme la nausée qui accompagne souvent le vertige. E 40, sur la jambe, sert quand on se sent lourd, la tête embrumée. Restez assis, et bougez la tête lentement.",alert:"Vertige avec trouble de la parole, faiblesse d'un côté, vision double, mal de tête violent ou chute : consultez un médecin sans attendre."}
 ]},
 {k:"grippe",name:"Symptômes grippaux",warn:["Reposez-vous et buvez souvent : c'est la base de la guérison. L'acupression s'y ajoute.","Avec de la fièvre ou une grande fatigue, pressez doucement et moins longtemps."],items:[
  {k:"rhume",name:"Rhume",pts:["GB20","GV14","BL13","LU7","LI4","TE5"],intro:"Tout au début du rhume. Des points de la main, de l'avant-bras et de la nuque qui, selon la tradition, aident le corps à chasser le froid.",alert:"Fièvre au-dessus de 39 °C qui dure, difficulté à respirer, ou chez un nourrisson."},
  {k:"nez",name:"Nez bouché",pts:["GV24","GV29","BL2","LI20","LI4"],intro:"Des points autour du nez et sur le front. GI 4, sur la main, renforce leur effet.",alert:"Nez bouché d'un seul côté qui dure, saignements de nez répétés, ou nez bouché avec fièvre et douleur du visage depuis plus de 10 jours : consultez un médecin."},
  {k:"sinusite",name:"Sinusite, douleur du visage",pts:["BL2","GV29","ST3","LI20","LI4","ST40"],intro:"Des points autour du nez, sous les yeux et entre les sourcils, là où les sinus se bouchent. GI 4 agit à distance, et E 40 sert quand les glaires sont épaisses. Pressez doucement : la zone est souvent sensible.",alert:"Gonflement ou rougeur autour de l'œil, trouble de la vue, mal de tête violent, nuque raide ou fièvre élevée : consultez un médecin sans attendre. Douleur qui dure plus de 10 jours, ou qui revient après une amélioration : consultez votre médecin."},
  {k:"gorge",name:"Mal de gorge",pts:["LU5","LU10","LU11","LI4","KI6"],intro:"P 11 et P 10, sur le pouce, quand la gorge est irritée. R 6, à la cheville, quand elle est sèche. GI 4, sur la main, calme la douleur.",alert:"Difficulté à avaler sa salive ou à respirer, voix étouffée, fièvre élevée."},
  {k:"toux",name:"Toux",pts:["BL13","CV22","LU1","KI27","LU5","LU7","ST40"],intro:"Des points du Poumon sur le bras et la poitrine, VC 22 pour la gorge, et E 40 quand la toux est grasse.",alert:"Toux qui dure plus de trois semaines, sang dans les crachats, essoufflement, fièvre élevée, douleur dans la poitrine."},
  {k:"fievre",name:"Fièvre",pts:["GV14","LI11","TE5","LI4"],intro:"Des points qui, selon la tradition, « rafraîchissent ». Ils s'ajoutent au traitement habituel, ils ne le remplacent pas.",alert:"Toute fièvre chez un bébé de moins de 3 mois. Fièvre qui dure plus de trois jours. Fièvre avec raideur de la nuque, taches sur la peau qui ne s'effacent pas quand on appuie dessus, confusion ou difficulté à respirer : consultez un médecin sans attendre."},
  {k:"courbatures",name:"Courbatures et frissons",pts:["GB20","GV14","LI4","TE5","BL40"],intro:"Quand la grippe donne froid et mal partout. Selon la tradition, ces points aident le corps à chasser le froid : sur la nuque, la main et l'avant-bras, et derrière le genou pour le dos. Restez bien au chaud.",alert:"Difficulté à respirer, douleur dans la poitrine, confusion, fièvre élevée qui dure, ou douleurs musculaires très fortes avec des urines foncées : consultez un médecin sans attendre."},
  {k:"apres-grippe",name:"Fatigue après une grippe",pts:["BL13","BL20","LU9","ST36","KI3"],intro:"Pour reprendre des forces une fois la fièvre passée. E 36 redonne de l'énergie ; P 9 et V 13 renforcent le souffle, selon la tradition.",alert:"Fatigue ou toux qui durent plus de trois à quatre semaines, essoufflement, douleur dans la poitrine, ou fièvre qui revient : consultez votre médecin."}
 ]},
 {k:"dos",name:"Nuque, dos & articulations",items:[
  {k:"torticolis",name:"Nuque raide, torticolis",pts:["WAILAOGONG","SI3","SI6","LU7","GB39","GB20","BL10"],intro:"Commencez par les points à distance, sur la main, l'avant-bras et la jambe : pressez-les en tournant doucement la tête. Puis finissez par les points de la nuque.",alert:"Nuque raide avec fièvre et mal de tête, après un choc, ou avec des fourmillements dans les bras."},
  {k:"epaules",name:"Épaules tendues",pts:["GV14","GB21","SI11","LI15","LI10"],intro:"Des points au sommet de l'épaule, sur l'omoplate et sur le bras.",alert:"Douleur de l'épaule gauche avec oppression dans la poitrine, essoufflement ou sueurs : appelez le 144."},
  {k:"lumbago",name:"Blocage du bas du dos (lumbago)",pts:["GV26","YAOTONGDIAN","SI3","BL40","BL57"],intro:"Pressez VG 26, sous le nez, puis fort les points de la main, pendant que la personne bouge doucement le bas du dos. V 40, derrière le genou, est le point classique du dos.",alert:"Engourdissement entre les jambes, perte de contrôle de la vessie, faiblesse d'une jambe, fièvre, ou douleur après une chute."},
  {k:"dos-chronique",name:"Mal de dos qui dure",pts:["GV4","BL23","BL25","BL40","KI3"],intro:"Des points du bas du dos, que la tradition relie aux « Reins ». On y ajoute R 3, à la cheville, et V 40, derrière le genou.",alert:"Douleur qui réveille la nuit, perte de poids inexpliquée, fièvre, ou douleur qui s'aggrave malgré le repos."},
  {k:"sciatique",name:"Sciatique",pts:["BL25","GB30","BL40","GB34","BL57","BL60"],intro:"V 25, dans le bas du dos, puis VB 30, au creux de la fesse. On suit ensuite la douleur le long de la jambe : V 40, V 57 et V 60 quand elle descend à l'arrière, VB 34 quand elle passe sur le côté.",alert:"Faiblesse de la jambe ou du pied, douleur dans les deux jambes, engourdissement entre les jambes, troubles urinaires : consultez un médecin sans attendre."},
  {k:"genou",name:"Douleur du genou",pts:["ST34","ST35","LR8","SP9","GB34","BL40"],intro:"Des points tout autour du genou : devant, à l'intérieur, à l'extérieur et derrière.",alert:"Genou très gonflé, chaud et rouge, ou impossible à plier ou à charger après un choc."},
  {k:"coude",name:"Coude et poignet",pts:["LI11","LU5","LI10","LI5","TE4","SI6","PC7"],intro:"Des points du coude et du poignet. Choisissez ceux qui sont le plus près de l'endroit qui fait mal.",alert:"Déformation, gonflement important après une chute, ou fourmillements nocturnes persistants dans les doigts."},
  {k:"cheville",name:"Cheville après une entorse",pts:["GB40","ST41","BL60","BL62"],intro:"Des points autour de la bosse extérieure de la cheville, devant, derrière et juste en dessous. Attendez que le gonflement ait disparu : ne pressez pas une entorse récente.",alert:"Impossible de poser le pied, douleur sur l'os, gonflement important : faites vérifier qu'il n'y a pas de fracture."},
  {k:"crampes",name:"Crampes du mollet",pts:["GB34","BL57"],intro:"V 57, au milieu du mollet, et VB 34, sous le genou : c'est le point classique des muscles et des tendons.",alert:"Mollet chaud, gonflé et douloureux d'un seul côté, surtout après un voyage ou une immobilisation : consultez un médecin sans attendre."}
 ]},
 {k:"digestion",name:"Digestion",items:[
  {k:"nausees",name:"Nausées, mal des transports",pts:["CV12","PC6","SP4"],ev:"etudes",evtext:"Presser MC 6 réduit les nausées après une opération (synthèse Cochrane mise à jour en 2025 ; preuves de qualité faible). Pour le mal des transports et la grossesse, les études se contredisent.",intro:"MC 6, sur l'intérieur du poignet, est le point de référence. Pour le mal des transports, pressez-le avant de partir, puis pendant le trajet.",alert:"Vomissements qui durent plus d'une journée, sang dans les vomissements, signes de déshydratation, douleur abdominale intense."},
  {k:"ballonnements",name:"Ballonnements",pts:["CV12","LR13","ST25","ST36","ST37","SP3"],intro:"Des points du ventre, autour du nombril et de l'estomac. E 36, sur la jambe, et Rt 3, sur le pied, renforcent la digestion.",alert:"Ventre dur et très douloureux, absence de selles et de gaz, vomissements."},
  {k:"digestion-lente",name:"Digestion lente, lourdeur après les repas",pts:["BL20","BL21","CV12","ST36","SP3"],intro:"Des points qui renforcent la digestion, sur le ventre, la jambe, le pied et le dos.",alert:"Perte de poids inexpliquée, difficulté à avaler, vomissements répétés."},
  {k:"constipation",name:"Constipation",pts:["BL25","ST25","TE6","ST37","ST41","KI6"],intro:"E 25, sur le ventre, et E 37, sur la jambe, sont les plus utilisés. Selon la tradition, E 37 agit directement sur le gros intestin. TR 6, sur l'avant-bras, est le point classique de la constipation ; on l'associe à R 6, à la cheville.",alert:"Sang dans les selles, selles noires, changement durable du transit, surtout après 50 ans."},
  {k:"diarrhee",name:"Diarrhée",pts:["BL25","CV8","ST25","ST36","ST37"],intro:"Des points qui agissent sur les intestins. VC 8, au nombril, sert quand la diarrhée dure et que le froid l'aggrave.",alert:"Sang dans les selles, fièvre élevée, signes de déshydratation, diarrhée qui dure plus de trois jours, ou chez un nourrisson."},
  {k:"reflux",name:"Reflux, aigreurs",pts:["LR14","CV12","PC6","ST36","ST44"],ptsFirst:true,intro:"VC 12, sur le ventre, apaise l'estomac, et MC 6, au poignet, calme ce qui remonte. E 36, sur la jambe, renforce la digestion. E 44, sur le pied, « rafraîchit » l'estomac quand ça brûle. F 14, sous la poitrine, sert quand le stress aggrave les aigreurs.",tips:["Évitez de vous coucher dans les 2 à 3 heures après un repas.","Si les aigreurs viennent la nuit, surélevez la tête du lit."],alert:"Douleur dans la poitrine, difficulté à avaler, vomissements de sang ou selles noires."},
  {k:"estomac",name:"Douleur d'estomac",pts:["ST34","ST36","PC6","SP4","BL21","CV12"],intro:"E 34, au-dessus du genou, est le point des douleurs d'estomac qui arrivent d'un coup : commencez par lui. E 36 sous le genou, MC 6 au poignet et VC 12 sur le ventre sont les trois points de base de la douleur d'estomac.",alert:"Douleur intense et soudaine, ou qui s'étend au dos, à la poitrine, au bras ou à la mâchoire, avec sueurs ou essoufflement : appelez le 144. Vomissements de sang ou selles noires : consultez sans attendre."},
  {k:"hoquet",name:"Hoquet",pts:["BL2","BL17","CV12","PC6","ST36"],intro:"V 2, au début du sourcil : une pression ferme d'une à deux minutes est un geste classique contre le hoquet. V 17, dans le dos, détend le diaphragme. MC 6 au poignet et VC 12 sur le ventre calment ce qui remonte de l'estomac.",alert:"Hoquet qui dure plus de 48 heures."}
 ]},
 {k:"sommeil",name:"Stress & sommeil",items:[
  {k:"insomnie",name:"Insomnie",pts:["SISHENCONG","GV29","ANMIAN","HT7","SP6","KI6","BL62","KI1"],ev:"etudes",evtext:"Une synthèse de 32 essais (Sleep Medicine Reviews, 2018) suggère que l'acupression améliore la qualité du sommeil, y compris par rapport à de faux points. C 7 est le point le plus étudié. Les études sont petites et souvent peu rigoureuses. Le traitement de référence de l'insomnie reste la thérapie cognitive et comportementale (TCC-I).",intro:"Le soir, au calme. Des points qui apaisent, au poignet, derrière l'oreille et sur le front. R 6 et V 62, de chaque côté de la cheville, se pressent en même temps.",alert:"Insomnie avec idées noires ou détresse : parlez-en à un médecin ou à un proche."},
  {k:"reveils",name:"Réveils dans la nuit",pts:["ANMIAN","HT7","SP6","KI6","LR3"],intro:"À presser au lit, après un réveil. C 7 et Anmian aident à se rendormir, Rt 6 et R 6 apaisent. Selon la tradition, des réveils réguliers entre 1 h et 3 h, l'heure du Foie, orientent vers F 3.",alert:"Ronflements forts avec des pauses de la respiration, réveils pour uriner plusieurs fois par nuit, sueurs la nuit, ou réveils avec des idées noires : parlez-en à votre médecin."},
  {k:"stress",name:"Stress au quotidien",pts:["GV24","GV29","GB21","CV17","PC6","HT7","LI4","LR3"],ptsFirst:true,breath:"apaiser",ev:"etudes",evtext:"Des essais montrent que l'acupression calme l'anxiété sur le moment, surtout avant un soin ou une opération (synthèse de 7 essais, Acupuncture in Medicine, 2015). Pour le stress de tous les jours, les études sont petites et de qualité moyenne. Ce qui est le mieux prouvé contre le stress : bouger, bien dormir et respirer lentement.",intro:"Pour relâcher la pression d'une journée chargée, en une dizaine de minutes. Selon la tradition, VG 24, VG 29 et C 7 apaisent l'esprit, VC 17 ouvre la poitrine, et GI 4 avec F 3, les « Quatre Barrières », libèrent ce qui est bloqué. VB 21 détend les épaules. Pendant chaque pression, respirez lentement, l'expiration plus longue que l'inspiration.",tips:["Respirez plus lentement : environ 6 respirations par minute, l'expiration plus longue que l'inspiration. Quelques minutes suffisent à ralentir le cœur et le souffle. La respiration guidée ci-dessus vous donne le rythme.","Bougez : une demi-heure de marche rapide la plupart des jours. L'activité physique fait partie de ce qui réduit le mieux le stress et l'anxiété.","Protégez votre sommeil : des horaires réguliers, et les écrans éteints une heure avant de dormir. Mal dormir rend plus sensible au stress.","Limitez le café et l'alcool. Le café augmente la nervosité. L'alcool détend sur le moment, mais aggrave l'anxiété et le sommeil ensuite.","Parlez-en à un proche ou à un professionnel. Les thérapies cognitives et comportementales (TCC) ont fait leurs preuves contre l'anxiété."],alert:"Douleur dans la poitrine, essoufflement inhabituel, ou palpitations qui ne passent pas : appelez le 144. Stress qui empêche de dormir, de travailler ou de manger depuis plusieurs semaines : parlez-en à votre médecin.",care:"Si vous vous sentez dépassé ou si des idées noires apparaissent, n'en restez pas seul : parlez-en à un proche ou à un médecin, ou appelez La Main Tendue au 143, jour et nuit."},
  {k:"angoisse",name:"Angoisse, crise d'anxiété",pts:["GV29","CV17","PC6","HT7"],ptsFirst:true,breath:"apaiser",ev:"trad",evtext:"Aucune étude n'a testé l'acupression pendant une crise d'angoisse. Elle a surtout été étudiée sur l'anxiété avant un soin, avec un effet calmant rapide mais de courte durée. Ce qui aide le plus pendant la crise : ralentir la respiration et revenir aux sensations du corps. La séance combine les deux.",intro:"Quand l'angoisse monte : le cœur s'emballe, la gorge ou la poitrine se serrent, on a l'impression de perdre pied. Asseyez-vous, les pieds à plat. Quatre points faciles à faire soi-même, partout, même discrètement : VG 29 entre les sourcils, VC 17 au milieu de la poitrine, puis MC 6 et C 7 au poignet. Pressez doucement et longtemps, en allongeant l'expiration.",tips:["Une crise d'angoisse est très désagréable, mais elle n'est pas dangereuse. Elle atteint son maximum en quelques minutes, puis redescend d'elle-même, le plus souvent en moins d'une demi-heure.","Le double soupir : inspirez par le nez, ajoutez une petite deuxième inspiration pour bien remplir les poumons, puis soufflez lentement et longuement par la bouche. Continuez 5 minutes. Dans une étude de Stanford (2023, 108 personnes), 5 minutes par jour pendant un mois ont réduit l'anxiété autant que la méditation, et amélioré davantage l'humeur.","Revenez au présent : nommez 5 choses que vous voyez, 4 que vous pouvez toucher, 3 que vous entendez, 2 odeurs et 1 goût.","Ne luttez pas contre la sensation. Dites-vous : « C'est une crise d'angoisse, elle va passer. » Se battre contre elle la fait souvent durer.","Si les crises reviennent, parlez-en à votre médecin. Les thérapies cognitives et comportementales (TCC) sont le traitement de référence, avec de très bons résultats."],alert:"Une première crise avec douleur dans la poitrine, essoufflement, malaise ou engourdissement d'un côté du corps : appelez le 144, pour écarter d'abord un problème du cœur ou des poumons. Crises qui reviennent, peur d'en refaire une, ou angoisse qui vous fait éviter des lieux ou des situations : consultez votre médecin.",care:"Si vous vous sentez dépassé ou si des idées noires apparaissent, n'en restez pas seul : parlez-en à un proche ou à un médecin, ou appelez La Main Tendue au 143, jour et nuit."},
  {k:"palpitations",name:"Palpitations",pts:["BL15","PC6","HT5","HT7"],intro:"Des points du Cœur et du Maître du Cœur, sur le poignet, et V 15, dans le dos.",alert:"Palpitations avec malaise, douleur dans la poitrine ou essoufflement : appelez le 144. Faites toujours vérifier des palpitations par un médecin."},
  {k:"oppression",name:"Poitrine serrée, souffle court",pts:["DINGCHUAN","LU1","KI27","CV17","PC6"],intro:"Souvent liée au stress. Des points de la poitrine et du poignet qui aident à respirer et à se détendre, et Dingchuan, à la base du cou. L'asthme se soigne avec son traitement habituel.",alert:"Douleur ou oppression dans la poitrine, essoufflement soudain, lèvres bleues : appelez le 144. L'asthme se traite avec son traitement médical."}
 ]},
 {k:"esprit",name:"Émotions & esprit",items:[
  {k:"irritabilite",name:"Irritabilité, colère",pts:["BL18","LR3","LR2"],intro:"Des points du Foie, sur le pied et dans le dos. Selon la tradition, ils font circuler l'énergie et calment ce qui monte à la tête.",alert:"Changement d'humeur brutal et durable : parlez-en à un médecin."},
  {k:"tristesse",name:"Tristesse, désespoir",pts:["GV20","GV29","CV17","PC6","HT7","LR3"],ev:"etudes",evtext:"Une synthèse de 14 essais (World Journal of Psychiatry, 2022) montre que l'acupression peut alléger des symptômes dépressifs légers à modérés. Les études sont très variées et les preuves restent à confirmer.",intro:"Des points qui, selon la tradition, apaisent le cœur et « soulèvent » l'esprit : au sommet du crâne, entre les sourcils, au poignet et au milieu de la poitrine. Respirez lentement, une main posée sur VC 17.",care:"Si le désespoir s'installe ou si des idées noires apparaissent, n'en restez pas seul : parlez-en à un proche ou à un médecin, ou appelez La Main Tendue au 143, jour et nuit."},
  {k:"recentrer",name:"Se recentrer, revenir au présent",pts:["KI1","ST36","CV6","HT7","GV29"],ev:"trad",evtext:"Ces points viennent de la tradition, qui parle d'« enraciner » l'esprit. Des études montrent en revanche qu'une respiration lente et l'attention portée aux sensations du corps aident à se calmer : c'est ce que propose cette séance.",intro:"Pour sortir des pensées qui s'emballent et revenir ici et maintenant. Pieds bien à plat, commencez par R 1 sous le pied et E 36 sur la jambe, puis le bas-ventre (VC 6). À chaque pression, sentez le contact du doigt et laissez l'expiration s'allonger."},
  {k:"attention",name:"Attention, concentration",pts:["GV20","SISHENCONG","GV24","HT7","KI3"],ev:"trad",evtext:"Aucun essai solide n'a étudié l'acupuncture ou l'acupression pour le trouble de l'attention (TDAH) : une revue Cochrane (2011, mise à jour en 2022) n'en a trouvé aucun. Ces points viennent de la tradition. Pour un TDAH, l'acupression ne remplace pas un suivi.",intro:"Selon la tradition, l'attention dépend d'un esprit calme. Des points au sommet du crâne pour éclaircir la tête, C 7 pour apaiser l'agitation, et R 3, que la tradition relie à la volonté et à la mémoire. Des séances courtes, avant un travail qui demande de la concentration."},
  {k:"fatigue-mentale",name:"Esprit clair, tête embrumée",pts:["GV20","SISHENCONG","HT7","ST36","ST40"],intro:"Quand la tête est lourde et les idées floues. Des points au sommet du crâne pour éclaircir la tête, E 40, que la tradition utilise contre la « tête embrumée », et E 36 pour l'énergie.",alert:"Troubles de la mémoire qui s'installent ou confusion : consultez un médecin."}
 ]},
 {k:"energie",name:"Énergie & vitalité",items:[
  {k:"fatigue",name:"Fatigue",pts:["BL20","BL23","CV6","CV4","ST36","KI3"],intro:"Des points qui redonnent de l'énergie. Les plus connus : E 36, sur la jambe, et VC 6, sous le nombril.",alert:"Fatigue qui dure plusieurs semaines sans explication, avec perte de poids, fièvre ou essoufflement."},
  {k:"froid",name:"Frilosité, froid dans le bas du dos",pts:["GV4","BL23","CV8","CV4"],intro:"Des points qui réchauffent, dans le bas du dos et sous le nombril.",alert:"Frilosité inhabituelle avec grande fatigue et prise de poids : demandez un bilan à votre médecin."},
  {k:"sueurs",name:"Sueurs la nuit",pts:["HT6","KI7"],intro:"C 6, au poignet, et R 7, à la cheville. Selon la tradition, ils règlent la transpiration.",alert:"Sueurs nocturnes avec fièvre ou perte de poids : consultez un médecin."},
  {k:"oedemes",name:"Jambes gonflées, rétention d'eau",pts:["SP9","ST40","SP6","KI7"],intro:"Rt 9, sous le genou, et R 7, à la cheville, aident le corps à éliminer l'eau en trop.",alert:"Une seule jambe gonflée, chaude et douloureuse, ou essoufflement en position couchée : consultez un médecin sans attendre. Pendant la grossesse : gonflement soudain du visage ou des mains, avec mal de tête, trouble de la vue ou douleur sous les côtes : appelez sans attendre votre sage-femme ou la maternité."}
 ]},
 {k:"femmes",name:"Femmes",items:[
  {k:"regles-douloureuses",name:"Règles douloureuses",pts:["SP10","SP8","SP6","LR3","CV4","ZIGONG"],ev:"etudes",evtext:"Une synthèse Cochrane (2016, 42 essais, 4 640 femmes) trouve des résultats encourageants pour l'acupuncture et l'acupression, mais des preuves de qualité faible à très faible : on ne peut pas encore dire si elles sont efficaces. Les anti-inflammatoires vendus en pharmacie restent le traitement de base.",intro:"Rt 6, sur la jambe, est le point le plus utilisé contre les règles douloureuses. Rt 8 sert quand la douleur est forte, et F 3 détend. Sur le bas-ventre, appuyez doucement sur VC 4 et Zigong ; une bouillotte peut les compléter. Commencez quelques jours avant les règles.",alert:"Douleur inhabituelle ou très intense, douleur qui s'aggrave d'année en année ou pendant les rapports, saignements très abondants, fièvre, ou grossesse possible : consultez votre médecin ou votre gynécologue."},
  {k:"regles-irregulieres",name:"Règles irrégulières",pts:["CV4","ZIGONG","SP6","SP4"],intro:"Des points qui régularisent le cycle, sur le bas-ventre, la jambe et le pied. Si une grossesse est possible, faites d'abord un test : VC 4, Zigong et Rt 6 sont à éviter pendant la grossesse.",alert:"Absence de règles avec possible grossesse, saignements entre les règles ou après la ménopause."},
  {k:"seins",name:"Tension des seins avant les règles",pts:["SI11","CV17","LR14","GB41","LR3"],intro:"Des points qui, selon la tradition, relâchent les tensions : sur l'omoplate, au milieu et sous la poitrine, et sur le pied. F 3 et VB 41 sont les plus utilisés. Appuyez doucement, à côté du sein et non dessus. Commencez une semaine avant les règles.",alert:"Grosseur dans un sein, écoulement du mamelon, peau rétractée : consultez un médecin."},
  {k:"nausees-grossesse",name:"Nausées de grossesse",pts:["PC6"],ev:"etudes",evtext:"Pendant la grossesse, les études sur MC 6 sont peu nombreuses et se contredisent : une synthèse Cochrane (2015, 41 essais tous traitements confondus) juge les preuves limitées.",intro:"Un seul point : MC 6. Pendant la grossesse, plusieurs autres points sont à éviter. Activez le mode grossesse dans Profil pour les voir signalés.",alert:"Vomissements qui empêchent de boire, perte de poids, saignement ou douleur au ventre : contactez votre sage-femme ou votre médecin."},
  {k:"menopause",name:"Ménopause : séance générale",pts:["CV4","HT7","SP6","KI3","KI6","LR3"],ev:"trad",evtext:"Une revue Cochrane (2013) ne trouve pas de différence entre l'acupuncture et une fausse acupuncture contre les bouffées de chaleur. Comparée à l'absence de traitement, elle semble aider un peu, mais les preuves sont de faible qualité. Un grand essai australien (327 femmes, Annals of Internal Medicine, 2016) n'a pas trouvé l'acupuncture plus efficace qu'une fausse acupuncture. Pour l'acupression, il n'existe que de petits essais.",intro:"Une séance de base pour les troubles de la ménopause. Selon la tradition, ils viennent souvent d'un manque de « Yin » des Reins, c'est-à-dire de fraîcheur : d'où la chaleur, les sueurs et les nuits agitées. Ces points rafraîchissent, apaisent et calment l'humeur. Une à deux fois par jour, sur plusieurs semaines.",alert:"Saignements après la ménopause (après 12 mois sans règles) : consultez votre gynécologue. Bouffées de chaleur avec perte de poids, palpitations ou fièvre : consultez votre médecin. Des traitements médicaux efficaces existent : parlez-en."},
  {k:"bouffees",name:"Ménopause : bouffées de chaleur",pts:["LI11","HT6","KI7","KI6","LR2"],ev:"trad",evtext:"Une revue Cochrane (2013) ne trouve pas de différence entre l'acupuncture et une fausse acupuncture contre les bouffées de chaleur. Comparée à l'absence de traitement, elle semble aider un peu, mais les preuves sont de faible qualité. Un grand essai australien (327 femmes, Annals of Internal Medicine, 2016) n'a pas trouvé l'acupuncture plus efficace qu'une fausse acupuncture. Pour l'acupression, il n'existe que de petits essais.",intro:"Des points qui, selon la tradition, « rafraîchissent » et calment la chaleur qui monte : à la cheville, au poignet, au pied et au coude. Pressez-les dès qu'une bouffée arrive, et le soir."},
  {k:"nuits-meno",name:"Ménopause : sueurs et réveils la nuit",pts:["ANMIAN","HT7","HT6","KI7","KI6"],intro:"C 6 et R 7 règlent la transpiration, selon la tradition ; C 7 et Anmian aident à se rendormir. À presser le soir au coucher, ou au lit après un réveil."},
  {k:"humeur-meno",name:"Ménopause : humeur changeante",pts:["GV29","BL18","PC6","HT7","LR3"],intro:"Pour les hauts et les bas, l'irritabilité et les larmes faciles. F 3 relâche les tensions, MC 6 et C 7 apaisent, VG 29 calme l'esprit."},
  {k:"pensees-meno",name:"Ménopause : pensées qui tournent",pts:["SISHENCONG","GV24","GV29","ANMIAN","HT7","KI1"],intro:"Quand le « cerveau qui trotte » empêche de se poser. Des points sur la tête qui apaisent l'esprit, et R 1 sous le pied, qui fait « redescendre » ce qui monte à la tête. Respirez lentement pendant chaque pression."}
 ]},
 {k:"peau",name:"Peau",warn:["Ne pressez jamais sur une peau abîmée, enflammée ou infectée, ni sur un bouton ou une plaque d'eczéma. Les points proposés sont sur les bras et les jambes, sur une peau saine.","Lavez-vous les mains avant et après la séance, surtout si vous touchez le visage."],items:[
  {k:"acne",name:"Acné, boutons",pts:["LI11","LI4","SP10","ST36","ST44"],ptsFirst:true,ev:"trad",evtext:"Une synthèse Cochrane (2015) sur les médecines complémentaires contre l'acné (plantes, acupuncture, ventouses, alimentation… : 35 études, 3 227 personnes) n'a pas trouvé de preuve fiable pour l'acupuncture : les résultats se contredisent et les études sont de faible qualité. Pour la pression des doigts, il n'existe pas d'étude solide. L'acupression peut accompagner un traitement, pas le remplacer.",intro:"Selon la tradition, l'acné vient d'une « chaleur » qui monte vers le visage. GI 11 et GI 4, sur le bras et la main, avec Rt 10 au-dessus du genou, la « rafraîchissent ». E 36 et E 44, sur la jambe et le pied, soutiennent la digestion. On ne presse jamais sur les boutons.",tips:["Lavez le visage matin et soir avec un nettoyant doux, puis rincez à l'eau tiède. Frotter fort ou se laver plus souvent irrite la peau sans aider.","Ne percez pas et ne grattez pas les boutons : cela peut infecter la peau et laisser des taches ou des cicatrices qui restent.","Choisissez des crèmes, du maquillage et une protection solaire « non comédogènes » : ils ne bouchent pas les pores.","Les traitements qui ont fait leurs preuves existent en pharmacie ou sur ordonnance : peroxyde de benzoyle, rétinoïdes en crème, antibiotiques en crème ou en comprimés. Demandez conseil au pharmacien ou au médecin.","Soyez patient : un traitement met 6 à 8 semaines à agir. Évitez de changer de produit chaque semaine.","Quelques petites études suggèrent qu'éviter les sucres rapides (sodas, pâtisseries, pain blanc) aide un peu. Les preuves restent faibles."],alert:"Gros boutons durs et douloureux, marques ou cicatrices qui apparaissent, acné qui pèse sur le moral, ou acné qui commence à l'âge adulte avec des règles irrégulières ou plus de poils : consultez un médecin ou un dermatologue."},
  {k:"demangeaisons",name:"Démangeaisons, urticaire, eczéma",pts:["BL17","LI11","LI4","GB31","SP10"],intro:"GI 11, au coude, et GI 4, sur la main, avec Rt 10 au-dessus du genou, calment les rougeurs. V 17, dans le dos, agit sur le Sang, et VB 31, sur la cuisse, calme les démangeaisons.",alert:"Gonflement du visage, des lèvres ou de la gorge, difficulté à respirer : appelez le 144. Démangeaisons sans boutons ni plaques qui durent plus de deux semaines, ou avec jaunisse, fatigue ou perte de poids : consultez votre médecin."}
 ]},
 {k:"chirurgie",name:"Chirurgie : avant et après",warn:["Ne pressez jamais sur la cicatrice ni autour, ni sur la partie du corps opérée, tant que l'équipe soignante ne l'a pas permis.","Évitez le bras qui porte une perfusion ou un cathéter.","Après une opération, on reçoit souvent un médicament qui fluidifie le sang : pressez doucement, les bleus viennent vite.","Ne touchez pas un mollet gonflé, chaud ou douloureux : ce peut être une phlébite (un caillot), à signaler sans attendre.","L'acupression s'ajoute au traitement, elle ne le remplace pas. Continuez les médicaments prescrits."],items:[
  {k:"anxiete-preop",name:"Stress avant l'opération",pts:["GV29","PC6","HT7"],ev:"etudes",evtext:"Une synthèse de 7 essais (Acupuncture in Medicine, 2015) conclut que l'acupression calme l'anxiété juste avant une opération ou un soin, mieux que des faux points. L'effet est immédiat et de courte durée. Les études sont encore peu nombreuses.",intro:"La veille et le matin de l'opération, au calme. Pressez doucement VG 29, entre les sourcils, pendant 1 à 3 minutes en respirant lentement. Puis C 7 et MC 6, au poignet."},
  {k:"nausees-postop",name:"Nausées après l'opération",pts:["PC6"],ev:"etudes",evtext:"C'est l'usage le mieux étudié de l'acupression. Une synthèse Cochrane (mise à jour en 2025, 77 essais, près de 10 000 personnes) montre que stimuler MC 6, avec ou sans aiguilles (pression, bracelet), réduit les nausées et les vomissements après une opération, par rapport à de faux points. L'effet est du même ordre que celui des médicaments contre la nausée, et semble s'y ajouter. Les preuves sont de qualité faible.",intro:"MC 6, à l'intérieur du poignet, des deux côtés. Pressez 1 à 2 minutes, plusieurs fois par jour, ou portez un bracelet d'acupression. On l'utilise aussi contre les nausées dues aux antidouleurs, un cas moins étudié."},
  {k:"douleur-postop",name:"Douleur après l'opération",pts:["PC6","LI4","ST36","LR3"],ev:"etudes",evtext:"Quelques petits essais, par exemple après une césarienne (GI 4 ou Rt 6), et une synthèse de 14 essais sur l'acupression de l'oreille après une fracture de la hanche (2023) montrent un peu moins de douleur et un peu moins d'antidouleurs. L'effet est modeste et la qualité des études reste faible.",intro:"On presse des points loin de la plaie, sur les mains, les poignets et les jambes. GI 4 et F 3 forment les « Quatre Barrières », utilisées contre la douleur. L'acupression s'ajoute aux antidouleurs, elle ne les remplace pas.",alert:"Douleur qui augmente au lieu de diminuer, fièvre, plaie rouge, chaude ou qui coule : prévenez l'équipe soignante."},
  {k:"transit-postop",name:"Reprise du transit",pts:["LI10","ST36","ST37"],ev:"etudes",evtext:"Un essai sur 60 personnes opérées de l'intestin (2013) : presser E 36 trois fois 3 minutes par jour a fait revenir les gaz plus tôt, sans changer le délai des premières selles. Avec de fines aiguilles reliées à un léger courant (électroacupuncture, sur E 36, E 37 et des points du ventre), un grand essai (248 personnes, JAMA Surgery 2023) a avancé d'environ 14 heures, en médiane, le retour des selles. Pour la simple pression, les preuves restent limitées.",intro:"Après une opération du ventre, ou avec des antidouleurs qui constipent. E 36 et E 37, sur le devant de la jambe, sont les plus utilisés : 3 minutes, trois fois par jour. GI 10, sur l'avant-bras, est un point que la tradition relie aux intestins. Ne pressez pas sur le ventre s'il a été opéré.",alert:"Ventre qui gonfle et durcit, vomissements, aucun gaz ni selle plusieurs jours après l'opération, ou fièvre : prévenez l'équipe soignante sans attendre."},
  {k:"fatigue-postop",name:"Fatigue, reprendre des forces",pts:["GV20","ST36","KI3"],intro:"Selon la tradition, une opération épuise l'énergie et le Sang. E 36, sur la jambe, est le point classique pour reprendre des forces. Des séances courtes, une ou deux fois par jour, suffisent."},
  {k:"sommeil-hopital",name:"Mal dormir à l'hôpital",pts:["GV29","ANMIAN","HT7","KI6","BL62"],intro:"Bruit, douleur, position inhabituelle : on dort souvent mal après une opération. Ces points se pressent facilement couché, au poignet, derrière l'oreille, sur le front et aux chevilles."},
  {k:"cicatrisation",name:"Cicatrisation",pts:[],ev:"none",evtext:"Aucun point d'acupression n'a montré qu'il accélère la cicatrisation, et la tradition de l'acupression n'a pas de point réservé à cela.",intro:"Pour la cicatrisation, l'acupression n'a rien de prouvé à offrir. Voici ce qui aide vraiment, d'après les études.",tips:["Ne pas fumer. Le tabac est l'un des principaux freins à la cicatrisation. Arrêter, même quelques semaines, réduit les complications.","Bien manger, avec assez de protéines : viande, poisson, œufs, laitages, légumineuses. La peau en a besoin pour se reconstruire.","En cas de diabète, garder une glycémie bien équilibrée : le sucre en excès ralentit la guérison des plaies.","Suivre les consignes de soin de la plaie : propreté, pansement, douche ou bain.","Bouger dès que l'équipe le permet. Marcher aide la circulation et réduit le risque de caillot.","Une fois la plaie bien fermée, masser doucement la cicatrice avec une crème et la protéger du soleil pendant au moins un an. Elle reste plus souple et marque moins (preuves modestes)."]},
  {k:"medicaments",name:"Éliminer les médicaments ?",pts:["PC6","ST36","ST37"],ev:"none",evtext:"Aucune étude ne montre qu'un point d'acupression aide le corps à éliminer les médicaments. Ce sont le foie et les reins qui s'en chargent, tout seuls.",intro:"Il n'existe pas de point « détox ». En revanche, l'acupression peut aider contre deux effets fréquents des médicaments de l'opération : les nausées (MC 6) et la constipation due aux antidouleurs (E 36, E 37).",tips:["Buvez selon les consignes de l'équipe soignante.","Évitez les cures « détox », les compléments et les plantes sans en parler au médecin ou au pharmacien : certaines plantes, comme le millepertuis, changent l'effet des médicaments.","Ne réduisez pas les antidouleurs de vous-même : une douleur bien soulagée aide à bouger et à récupérer."]}
 ]}
];

let _defsDone = false;
function mountFigureDefs(){
 if(_defsDone) return; _defsDone = true;
 const host = document.createElementNS("http://www.w3.org/2000/svg","svg");
 host.setAttribute("width","0"); host.setAttribute("height","0");
 host.setAttribute("aria-hidden","true");
 host.style.position="absolute";
 host.innerHTML = "<defs>" + (FIG_DEFS + ARM_DEFS).replace(/<(path|ellipse|circle|rect)\b/g,'<$1 vector-effect="non-scaling-stroke"') + "</defs>";
 document.body.prepend(host);
}

function clampBox(v, cx, cy, size){
 const b = BASE[v];
 let w = Math.min(size, b.w), h = Math.min(size, b.h);
 let x = cx - w/2, y = cy - h/2;
 x = Math.max(0, Math.min(b.w - w, x));
 y = Math.max(0, Math.min(b.h - h, y));
 return [x,y,w,h];
}

// Silhouette femme quand elle est choisie dans Profil (homme par défaut).
const FEMALE = {"front-sil":"front-sil-f","front-det":"front-det-f","back-sil":"back-sil-f","back-det":"back-det-f","side-body":"side-body-f","side-det":"side-det-f"};
function figureLayers(v){
 const f = typeof S !== "undefined" && S.sex === "f";
 return BASE[v].layers.map(([sil,det]) => {
  if (f){ sil = FEMALE[sil] || sil; det = FEMALE[det] || det; }
  return `<use href="#${sil}" class="sil-o"/><use href="#${sil}" class="sil-f"/><use href="#${det}" class="sil-d"/>`;
 }).join("");
}

// Repères : tous discrets, ceux du point actif soulignés et nommés.
function landmarkLayer(v, on, u, showLabels=true, box=null){
 const set = LANDMARKS[BASE[v].lm]; if (!set) return "";
 let g = "", t = "";
 for (const l of set){
  const act = on && on.includes(l.k);
  g += `<g class="lm${act ? " lm-on" : ""}${l.dash ? " lm-dash" : ""}">${l.svg}</g>`;
  let lx = l.lx, a = l.a;
  if (act && showLabels && box){
   const w = l.label.length * 12*u * 0.5, pad = 6*u, right = box[0] + box[2] - pad, left = box[0] + pad;
   if (a === "start" && lx + w > right){ lx = right; a = "end"; }
   if (a === "end" && lx - w < left){ lx = left; a = "start"; }
   if (a === "end" && lx > right) lx = right;
   if (a === "start" && lx < left) lx = left;
  }
  if (act && showLabels) t += `<text class="lm-lbl" x="${lx}" y="${l.ly}" text-anchor="${a}" style="font-size:${12*u}px;stroke-width:${3.2*u}px">${l.label}</text>`;
 }
 return g + t;
}

// Planches illustrées : plates/manifest.json (voir CONTRACT.md).
// Une planche = l'image d'une vue (homme ou femme), le calque des
// repères en filigrane, et par-dessus un SVG en pixels de l'image :
// point, point miroir, mesure en cun, repères nommés.
// Un point absent du manifeste garde l'ancien schéma SVG (figure()).
// Uniquement des déclarations : S, BY, code()… viennent de app.js.
// ─────────────────────────────────────────────────────────────
const PL_DIR = "plates/";
const PL = { man:null, loc:{}, bb:{}, small:{} };

function plLoad(){
 return fetch(PL_DIR + "manifest.json", {cache:"no-cache"})
  .then(r => r.ok ? r.json() : null)
  .then(m => { if (m && m.views && m.points){ PL.man = m; return Promise.all([plLocSizes(), plBBoxes(), plSmall()]); } })
  .catch(() => {});
}
// Cadre du sujet dans chaque image (facultatif : plates/bbox.json, fait par tools/plates_bbox.py).

 return fetch(PL_DIR + "bbox.json", {cache:"no-cache"}).then(r => r.ok ? r.json() : null).then(b => { if (b && typeof b === "object") PL.bb = b; }).catch(() => {});
}
// Copies réduites (plates/s/, faites par tools/plates_small.py) pour les pages à plusieurs planches.
function plSmall(){
 return fetch(PL_DIR + "s/index.json", {cache:"no-cache"}).then(r => r.ok ? r.json() : null).then(b => { if (b && typeof b === "object") PL.small = b; }).catch(() => {});
}
function plSrc(f, small){ // [url, w, h] ou null

}
function plSubject(V){ // [x0,y0,x1,y1] du sujet, avec une petite marge ; sinon l'image entière
 const W = V.s.w, H = V.s.h, b = PL.bb[V.s.img];
 if (!Array.isArray(b) || b.length < 4 || !(b[2] > b[0]) || !(b[3] > b[1])) return [0, 0, W, H];
 const mx = .05 * (b[2] - b[0]), my = .05 * (b[3] - b[1]);

}
// Taille des silhouettes de repérage (pour y poser le rectangle de la vue).
function plLocSizes(){
 const lf = PL.man.loc_files || {}, jobs = [];
 for (const k of Object.keys(lf)) for (const w of Object.keys(lf[k] || {})){
  const f = lf[k][w]; if (typeof f !== "string" || !f) continue;
  jobs.push(new Promise(res => {
   const im = new Image();
   im.onload = () => { PL.loc[k + w] = {w: im.naturalWidth, h: im.naturalHeight}; res(); };
   im.onerror = () => res();
   im.src = PL_DIR + f;
  }));

}

const plSex = () => (typeof S !== "undefined" && S.sex === "f") ? "f" : "m";

const plEntry = p => PL.man && PL.man.points ? PL.man.points[p.id] || null : null;

 const V = plView(e.view); if (!V) return null;

// ── Orientation : « Main gauche · dos de la main » ───────────
const plSideOf = s => { const t = norm(s || ""); return /gauche/.test(t) ? "L" : /droit/.test(t) ? "R" : null; };

  const r = /^g/i.test(w) ? (FEM.test(norm(prev)) ? "droite" : "droit") : "gauche";
  return prev + sp + (up ? plCap(r) : r);

function plOrient(V, flip){

 const face = plFace(v.face, limb, side);

// ── Cadrage : toujours l'unité reconnaissable entière ─────────
// Les planches sont cadrées sur une partie du corps. Tête, visage, main,
// pied, épaule, tronc, dos, corps entier : on montre l'image entière.
// Membres longs (avant-bras, cuisse, jambe) : toute la largeur, et du point

// hauteur, pour voir l'articulation (poignet ou coude, genou ou cheville).
function plUnit(V){

 // l'articulation lisible (poignet et main, genou) est en bas
 const t = norm([V.vid, V.v.limb, V.v.label].join(" "));
 const bottom = (/avant-bras|forearm/.test(t) && !/coude|elbow/.test(t)) || /cuisse|thigh/.test(t);

// ── Cadrage : autour du point, avec assez de contexte ─────────
// pts : points à garder dans le cadre ; o : {aspect, pad (cun), minCun, minFrac}
function plCrop(V, pts, o){

  const [[ux0, uy0], [ux1, uy1]] = plUnitBox(V, pts);
  x0 = Math.min(x0, ux0); y0 = Math.min(y0, uy0); x1 = Math.max(x1, ux1); y1 = Math.max(y1, uy1);

// ── Zones à ne jamais couvrir (yeux, sourcils, nez, bouche) ────
// Ellipses [cx, cy, rx, ry] en pixels de l'image. Le manifeste peut les donner

// ── Étiquettes : toujours dans le cadre, sans chevauchement ───

// Largeur réelle du texte (canvas), pour que la pastille contienne toujours tout le libellé.
let _plCtx = null;

function loadSample(name){

  .then(ab => new Promise((res, rej) => SND.ac.decodeAudioData(ab, res, rej)))
  .then(buf => { buf._lp = loopPoints(buf); SND.files[name] = buf; return buf; });
