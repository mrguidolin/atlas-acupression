<style>
/* Concept : inspiration Bootstrap 5. Fond gris très clair, cartes blanches à bord fin
   et ombre légère, boutons pleins bleu primaire #0d6efd, badges en pilule, police
   système. Le rouge « danger » est réservé aux points ; les couleurs Bootstrap
   (orange, vert, indigo, cyan, jaune, rose, sarcelle) marquent les familles. */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface2:#F1F3F5; --card:#FFFFFF;
  --ink:#212529; --muted:#6C757D; --faint:#8D959C; --hair:#DEE2E6; --hair2:#CED4DA;
  --brand:#0D6EFD; --brand-hover:#0B5ED7; --brand-ink:#0A58CA; --brand-soft:#CFE2FF; --brand-emph:#052C65; --brand-border:#9EC5FE;
  --point:#DC3545; --point-soft:#F8D7DA;
  --alert:#B02A37; --alert-soft:#F8D7DA; --warn:#997404; --warn-soft:#FFF3CD;
  --succ:#198754; --succ-soft:#D1E7DD; --succ-emph:#0A3622;
  --fig-paper:#FFFFFF; --fig-line:#212529; --fig-soft:#ADB5BD; --fig-lm:#212529;
  --metal:#6C757D; --earth:#FD7E14; --fire:#D63384; --water:#0D6EFD; --wood:#198754; --vessel:#6F42C1; --extra:#6C757D;
  --c-tete:#0D6EFD; --c-dos:#FD7E14; --c-digestion:#198754; --c-sommeil:#6610F2;
  --c-respiration:#0DCAF0; --c-energie:#FFC107; --c-femmes:#D63384; --c-peau:#20C997; --c-chirurgie:#DC3545; --c-grippe:#0DCAF0; --c-esprit:#6F42C1;
  --shadow-sm:0 .125rem .25rem rgba(0,0,0,.075);
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  --f-han:"Noto Sans SC","PingFang SC","Hiragino Sans GB",sans-serif;
  --r:.75rem; --r-sm:.5rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1D20; --surface:#212529; --surface2:#2B3035; --card:#212529;
  --ink:#DEE2E6; --muted:#ADB5BD; --faint:#8C959D; --hair:#373B3E; --hair2:#495057;
  --brand:#0D6EFD; --brand-hover:#3D8BFD; --brand-ink:#6EA8FE; --brand-soft:#031633; --brand-emph:#9EC5FE; --brand-border:#084298;
  --point:#EA5A68; --point-soft:#2C0B0E;
  --alert:#EA868F; --alert-soft:#2C0B0E; --warn:#FFDA6A; --warn-soft:#332701;
  --succ:#75B798; --succ-soft:#051B11; --succ-emph:#A3CFBB;
  --fig-paper:#2B3035; --fig-line:#E9ECEF; --fig-soft:#6C757D; --fig-lm:#E9ECEF;
  --metal:#ADB5BD; --earth:#FEB272; --fire:#E685B5; --water:#6EA8FE; --wood:#75B798; --vessel:#A98EDA; --extra:#ADB5BD;
  --c-tete:#3D8BFD; --c-dos:#FD9843; --c-digestion:#479F76; --c-sommeil:#8540F5;
  --c-respiration:#3DD5F3; --c-energie:#FFCD39; --c-femmes:#DE5C9D; --c-peau:#4DD4AC; --c-chirurgie:#EA868F; --c-grippe:#3DD5F3; --c-esprit:#A98EDA;
  --shadow-sm:0 .125rem .25rem rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1D20; --surface:#212529; --surface2:#2B3035; --card:#212529;
  --ink:#DEE2E6; --muted:#ADB5BD; --faint:#8C959D; --hair:#373B3E; --hair2:#495057;
  --brand:#0D6EFD; --brand-hover:#3D8BFD; --brand-ink:#6EA8FE; --brand-soft:#031633; --brand-emph:#9EC5FE; --brand-border:#084298;
  --point:#EA5A68; --point-soft:#2C0B0E;
  --alert:#EA868F; --alert-soft:#2C0B0E; --warn:#FFDA6A; --warn-soft:#332701;
  --succ:#75B798; --succ-soft:#051B11; --succ-emph:#A3CFBB;
  --fig-paper:#2B3035; --fig-line:#E9ECEF; --fig-soft:#6C757D; --fig-lm:#E9ECEF;
  --metal:#ADB5BD; --earth:#FEB272; --fire:#E685B5; --water:#6EA8FE; --wood:#75B798; --vessel:#A98EDA; --extra:#ADB5BD;
  --c-tete:#3D8BFD; --c-dos:#FD9843; --c-digestion:#479F76; --c-sommeil:#8540F5;
  --c-respiration:#3DD5F3; --c-energie:#FFCD39; --c-femmes:#DE5C9D; --c-peau:#4DD4AC; --c-chirurgie:#EA868F; --c-grippe:#3DD5F3; --c-esprit:#A98EDA;
  --shadow-sm:0 .125rem .25rem rgba(0,0,0,.3);
  color-scheme:dark}

html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:0;box-shadow:0 0 0 .25rem rgba(13,110,253,.35);border-radius:var(--r-sm)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.han{font-family:var(--f-han);font-weight:500}
.small{font-size:.875rem;color:var(--muted)}

/* ── Gabarit ── */
.screen{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:8px 112px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:28px 20px}
.hd h1{font-weight:700;font-size:2rem;line-height:1.1;letter-spacing:-.01em}
.hd p{color:var(--muted);font-size:1rem;margin-top:6px;max-width:42ch}
.roundbtn{flex:none;width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--brand);color:#fff;box-shadow:var(--shadow-sm)}
.roundbtn:hover{background:var(--brand-hover)}
.sect{margin-top:28px}
.sect-t{font-size:.8rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.fine{color:var(--muted);font-size:.82rem;margin-top:20px;max-width:60ch;line-height:1.45}
.empty{color:var(--muted);text-align:center;padding:48px 12px}
.card{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.badge{display:inline-block;padding:.35em .65em;font-size:.75em;font-weight:700;line-height:1;border-radius:50rem;background:var(--surface2);color:var(--ink);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:.6rem 1.2rem;border-radius:var(--r-sm);font-weight:500;border:1px solid transparent;min-height:44px}
.btn-primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn-primary:hover{background:var(--brand-hover)}
.btn-link{color:var(--brand-ink);text-decoration:underline;text-underline-offset:3px;padding:.5rem}

/* Contrôles (btn-group / nav-pills) */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--brand);border-radius:var(--r-sm);overflow:hidden;background:var(--card)}
.seg button{padding:.55rem .5rem;text-align:center;font-weight:500;font-size:.92rem;color:var(--brand-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button+button{border-left:1px solid var(--brand)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.seg-sm button{padding:.35rem .8rem;font-size:.85rem}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:.4rem .9rem;border-radius:50rem;border:1px solid var(--hair2);background:var(--card);font-size:.875rem;font-weight:500;color:var(--ink);white-space:nowrap;min-height:36px;text-decoration:none;display:inline-flex;align-items:center}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--hair2);border-radius:var(--r-sm);padding-inline:12px}
.search:focus-within{border-color:var(--brand-border);box-shadow:0 0 0 .25rem rgba(13,110,253,.2)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;padding:.6rem 0;outline:none}
.searchhead{display:flex;align-items:center;gap:12px;padding-block:20px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:4}
.searchhead .search{flex:1;min-width:0}
.cancel{color:var(--brand-ink);font-weight:500;padding:8px 2px}

/* Tuiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:grid;gap:12px;align-content:space-between;padding:16px;min-height:136px;background:var(--card);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .15s,border-color .15s}
.tile:hover{border-color:var(--tc);box-shadow:0 .5rem 1rem rgba(0,0,0,.08)}
.tile:active{transform:scale(.98)}
.tile-ic{width:44px;height:44px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--tc);background:color-mix(in srgb,var(--tc) 15%,transparent)}
.tile-ic svg{stroke-width:2}
.tile b{display:block;font-weight:600;font-size:1rem;line-height:1.25}
.tile small{display:block;color:var(--muted);font-size:.82rem;margin-top:3px}

/* Listes (list-group) */
.rows{list-style:none;margin:0;padding:0}
.list-card{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm)}
.list-card .rows li+li .row,.list-card .rows li+li .lrow{border-top:1px solid var(--hair)}
.row{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:12px 16px;min-height:64px}
.row:hover,.lrow:hover{background:var(--surface2)}
.code{display:inline-block;font-family:var(--f-mono);font-size:.76rem;font-weight:600;text-align:center;padding:.35em .5em;border-radius:50rem;color:var(--el);background:color-mix(in srgb,var(--el) 14%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t1{display:flex;gap:8px;align-items:baseline;min-width:0}
.row .py{font-size:1rem;font-weight:600;white-space:nowrap}
.row .hz{color:var(--faint);font-size:.86rem}
.row .t2{display:block;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{display:flex;gap:6px;align-items:center;color:var(--faint)}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:13px 16px;min-height:64px}
.lrow b{display:block;font-weight:600;font-size:1rem}
.lrow small{display:block;color:var(--muted);font-size:.84rem;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{display:flex;align-items:center;gap:6px}
.cnt .badge{background:var(--brand-soft);color:var(--brand-ink)}
.glyph{width:42px;height:42px;border-radius:var(--r-sm);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.8rem;color:#fff;background:var(--el)}
.chev{color:var(--faint);flex:none}
.badge-preg{font-size:.7rem;font-weight:700;color:#fff;background:var(--point);padding:.3em .6em;border-radius:50rem}
.star{color:var(--point)}
.ghead{display:flex;align-items:center;gap:10px;margin:24px 0 10px}
.ghead .dot{width:10px;height:10px;border-radius:50%;background:var(--el)}
.ghead b{font-weight:600}
.ghead span{color:var(--muted);font-size:.82rem}

/* ── Figures : pictogrammes ── */
.fig{display:block;width:100%;margin-inline:auto;touch-action:manipulation}
.figbox{background:var(--fig-paper);border-radius:var(--r-sm)}
.sil-o{fill:var(--fig-line);stroke:var(--fig-line);stroke-width:5px;stroke-linejoin:round;stroke-linecap:round}
.sil-f{fill:var(--fig-paper);stroke:none}
.sil-d{fill:none;stroke:var(--fig-line);color:var(--fig-line);stroke-width:2.2px;stroke-linecap:round;stroke-linejoin:round;opacity:.28}
.fig-text{font-family:var(--f-mono);font-size:6px;opacity:.6}
.lm{fill:none;stroke:var(--fig-soft);stroke-width:2.6px;stroke-linecap:round;stroke-dasharray:.5 7;opacity:.8}
.lm *{vector-effect:non-scaling-stroke}
.lm:not(.lm-on){display:none}
.lm-on{stroke:var(--fig-lm);stroke-width:3.4px;stroke-dasharray:.5 7;opacity:1}
.lm-lbl{font-family:var(--f-body);font-weight:700;fill:var(--fig-lm);paint-order:stroke;stroke:var(--fig-paper);stroke-linejoin:round}
.mk{fill:var(--fig-paper);stroke:var(--point);stroke-width:3px}
.mk-on{fill:var(--point);stroke:var(--fig-paper);stroke-width:2.5px}
.mk-dim{fill:var(--fig-paper);stroke:var(--fig-soft);stroke-width:2px}
.mk-lbl{font-family:var(--f-mono);font-weight:600;fill:var(--fig-line);paint-order:stroke;stroke:var(--fig-paper);stroke-linejoin:round}
.pill{fill:var(--point)}
.pill-t{font-family:var(--f-mono);font-weight:700;fill:#fff}
.halo{fill:none;stroke:var(--point);stroke-width:2.5px;transform-box:fill-box;transform-origin:center;animation:halo 1.8s ease-out infinite}
@keyframes halo{from{transform:scale(1);opacity:.85}to{transform:scale(2.6);opacity:0}}
.cun-l{fill:none;stroke:var(--brand);stroke-width:3px;stroke-linecap:round;vector-effect:non-scaling-stroke}
.cun-d{fill:none;stroke:var(--brand);stroke-width:2px;stroke-dasharray:.5 5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.cun-t{font-family:var(--f-body);font-weight:700;fill:var(--brand-ink);paint-order:stroke;stroke:var(--fig-paper);stroke-linejoin:round}
.mpath{fill:none;stroke-width:4px;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.tap{cursor:pointer}
.tap .hit{fill:transparent}
.tap:hover .mk,.tap:focus-visible .mk{fill:var(--point-soft)}
.cap{color:var(--muted);font-size:.84rem;text-align:center;margin-top:10px}

/* ── Pages poussées ── */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateX(0);transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.sheet.enter,.sheet.leave{transform:translateX(100%)}
.bar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 12px;background:var(--card);border-bottom:1px solid var(--hair)}
.bar .bar-t{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.bar .bar-r{justify-self:end}
.back{justify-self:start;display:flex;align-items:center;gap:2px;color:var(--brand-ink);font-weight:500;padding:8px 6px 8px 0;min-height:44px}
.iconbtn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.iconbtn[aria-pressed="true"]{color:var(--point)}
.detail{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px 56px}
.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--brand-ink);margin-bottom:6px}
.h1d{font-weight:700;font-size:1.9rem;line-height:1.15}
.sub{color:var(--muted);margin-top:8px;font-size:1rem}
.ptop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ptop .code{padding:.4em .8em;font-size:.82rem}
.mlink{color:var(--brand-ink);font-size:.9rem;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.ptitle{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ptitle h1{font-weight:700;font-size:2.3rem;line-height:1.05}
.ptitle .han{font-size:1.6rem;color:var(--faint)}
.ptr{font-size:1rem;color:var(--muted);margin-top:6px}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--alert-soft);color:var(--alert);border:1px solid color-mix(in srgb,var(--point) 35%,transparent);border-radius:var(--r-sm);padding:12px 14px;margin-top:16px;font-size:.92rem;font-weight:600}
.alert svg{flex:none;margin-top:2px;stroke:currentColor}
.figcard{margin-top:20px;padding:12px;background:var(--card);border:1px solid var(--hair);box-shadow:var(--shadow-sm)}
.figcard .seg{margin:12px auto 0;max-width:300px}
.howto{margin-top:14px;padding:16px;border-radius:var(--r-sm);background:var(--brand-soft);color:var(--brand-emph);border:1px solid var(--brand-border)}
.howto h2{font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.howto p{font-size:1rem;line-height:1.5}
.sec{margin-top:28px}
.sec>h2{font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.sec p{max-width:65ch}
details.more{margin-top:12px;border-top:1px solid var(--brand-border);padding-top:10px}
details.more summary{cursor:pointer;font-weight:600;font-size:.92rem;list-style:none;display:flex;align-items:center;gap:8px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s}
details.more[open] summary::before{transform:rotate(45deg)}
details.more p{margin-top:8px;font-size:.94rem;opacity:.85}
.fn{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.fn li{display:grid;grid-template-columns:22px minmax(0,1fr);align-items:start}
.fn li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brand);margin-top:.6em}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{font-size:.84rem;font-weight:500;padding:.35rem .8rem;border-radius:50rem;border:1px solid var(--hair2);background:var(--card);min-height:34px}
.cat[aria-expanded="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.gloss{margin-top:10px;padding:12px 14px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--hair);font-size:.9rem}
.gloss b{display:block;margin-bottom:2px}
.warnbox{border-left:4px solid var(--point);padding:2px 0 2px 12px}
.note{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:var(--r-sm);padding:12px 14px;font-size:.92rem}
.pnav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:32px}
.pnav button{border:1px solid var(--hair);border-radius:var(--r-sm);padding:10px 14px;background:var(--card);min-height:62px;box-shadow:var(--shadow-sm)}

.pnav small{display:block;color:var(--muted);font-size:.75rem}
.pnav span{font-weight:600;font-size:.96rem;color:var(--brand-ink)}
.pnav .nx{text-align:right}

/* Symptôme */
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;margin-top:16px;padding:12px 14px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--hair);font-size:.88rem;color:var(--muted)}
.ev i{font-style:normal;font-size:.72rem;font-weight:700;padding:.35em .65em;border-radius:50rem;background:var(--surface2);color:var(--ink);white-space:nowrap}
.ev-s i{background:var(--succ);color:#fff}
.pcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pcard{position:relative;display:grid;gap:8px;padding:8px 8px 12px;background:var(--card);border:1px solid var(--hair);border-radius:var(--r);text-align:left;box-shadow:var(--shadow-sm)}
.pcard:hover{border-color:var(--brand-border)}
.pc-n{position:absolute;top:14px;left:14px;z-index:1;width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:var(--brand);color:#fff;font-weight:700;font-size:.86rem}
.pc-t{display:flex;align-items:center;gap:8px;min-width:0;padding-inline:4px}
.pc-t .code{flex:none;padding:.3em .55em;font-size:.72rem}
.pc-t b{font-weight:600;font-size:.96rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard small{color:var(--muted);font-size:.78rem;padding-inline:4px;line-height:1.35}
.pcard.is-ci{border-color:var(--point)}
.pcard.is-ci small{color:var(--alert);font-weight:600}
.cathead{display:flex;align-items:center;gap:14px;margin-block:4px 18px}
.cathead .tile-ic{width:54px;height:54px}

/* Méridien */
.mhero-sub{color:var(--muted);margin-top:8px}
.clock{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center;padding:16px;margin-top:20px}
.clock svg{width:120px;height:120px}
.clock h3{font-size:1rem;font-weight:700;margin-bottom:4px}
.clock p{font-size:.88rem;color:var(--muted)}
.dial-seg{fill:var(--surface2)}
.dial-seg.on{fill:var(--el)}
.dial-t{font-family:var(--f-mono);font-weight:600;font-size:7px;fill:var(--muted);text-anchor:middle}
.dial-t.on{fill:#fff}
.dial-h{font-family:var(--f-mono);font-size:7px;font-weight:600;fill:var(--muted);text-anchor:middle}
.ex{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:14px;align-items:start;padding:16px;width:100%;text-align:left}
.ex+.ex{border-top:1px solid var(--hair)}
.ex .ex-ic{width:42px;height:42px;border-radius:var(--r-sm);display:grid;place-items:center;background:color-mix(in srgb,var(--el) 14%,transparent);font-family:var(--f-mono);font-size:.82rem;font-weight:700;color:var(--el)}
.ex b{display:block;font-weight:600;font-size:1rem}
.ex small{display:block;color:var(--muted);font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.ex p{color:var(--muted);font-size:.9rem;margin-top:4px;line-height:1.45}
.mfigs{display:grid;gap:12px}
.mfigs .card{padding:10px}

/* Pratiquer / Repères */
.toc{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);padding-block:6px 10px}
.prose p{margin-bottom:12px;max-width:65ch}
.prose h2{font-weight:700;font-size:1.4rem;margin:34px 0 12px;scroll-margin-top:70px}
.prose h3{font-size:1rem;font-weight:700;margin:20px 0 8px}
.prose ul{margin:0 0 12px;padding-left:1.15em;max-width:65ch}
.prose li{margin-bottom:8px}
.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;padding:14px;background:var(--card);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.step .sn{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;background:var(--brand);color:#fff;font-weight:700}
.step b{display:block;font-weight:600}
.step p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{padding:14px 10px;text-align:center;background:var(--card);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.kpi b{display:block;font-size:1.05rem;font-weight:700;color:var(--brand-ink);font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:.78rem;color:var(--muted);margin-top:2px}
.lvl{padding:16px 16px 6px;border-radius:var(--r);margin-bottom:12px;border:1px solid var(--hair);background:var(--card);box-shadow:var(--shadow-sm)}
.lvl .badge{margin-bottom:10px;font-size:.78rem}
.lvl p{font-size:.95rem}
.lvl-t{border-left:5px solid var(--warn)}
.badge-trad{background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.lvl-s{border-left:5px solid var(--succ)}
.badge-sci{background:var(--succ-soft);color:var(--succ);border:1px solid color-mix(in srgb,var(--succ) 35%,transparent)}
.cun{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0 20px}
.cun figure{margin:0;background:var(--card);border:1px solid var(--hair);border-radius:var(--r);padding:14px;display:grid;gap:6px;justify-items:center;text-align:center;box-shadow:var(--shadow-sm)}
.cun svg{width:100%;max-width:110px;height:auto}
.cun b{font-weight:700;color:var(--brand-ink)}
.cun figcaption{font-size:.85rem;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl td{padding:11px 0;border-bottom:1px solid var(--hair);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.tbl td:last-child{color:var(--brand-ink);font-weight:700}
.lex-i{padding:14px 16px}
.lex-i+.lex-i{border-top:1px solid var(--hair)}
.lex-i b{display:block;font-weight:600}
.lex-i p{margin:2px 0 0;color:var(--muted);font-size:.92rem}

/* Profil */
.setting{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px}
.setting b{display:block;font-weight:600}
.setting small{color:var(--muted);font-size:.86rem;display:block;margin-top:2px}
.switch{position:relative;width:50px;height:30px;border-radius:999px;background:var(--hair2);transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* Premier lancement */
.onb{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.5)}
.onb-card{width:min(420px,100%);background:var(--card);border-radius:var(--r);padding:24px;box-shadow:0 1rem 3rem rgba(0,0,0,.25);display:grid;gap:12px;justify-items:center;text-align:center}
.onb-ic{width:52px;height:52px;border-radius:999px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-ink)}
.onb-card h2{font-size:1.4rem;font-weight:700}
.onb-card p{color:var(--muted)}
.onb-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:6px}

/* Barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:.7rem;font-weight:500;color:var(--muted);min-height:56px}
.tabs svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--brand)}

@media (prefers-reduced-motion:reduce){
  .sheet{transition:none}
  .halo{animation:none;opacity:.4;transform:scale(2)}
}

/* ═══ Couche « Strava » : navigation, barres et listes pleine largeur ═══ */
:root{ --bg:#F2F2F7; --card:#FFFFFF; --surface:#FFFFFF; --surface2:#F2F2F7; --hair:#E5E5EA; --hair2:#D1D1D6; --ink:#1C1C1E; --muted:#6D6D72; --tabink:#8E8E93; }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --bg:#000000; --card:#1C1C1E; --surface:#1C1C1E; --surface2:#2C2C2E; --hair:#2C2C2E; --hair2:#3A3A3C; --ink:#F2F2F7; --muted:#AEAEB2; --tabink:#8E8E93; --fig-paper:#1C1C1E; }}
:root[data-theme="dark"]{ --bg:#000000; --card:#1C1C1E; --surface:#1C1C1E; --surface2:#2C2C2E; --hair:#2C2C2E; --hair2:#3A3A3C; --ink:#F2F2F7; --muted:#AEAEB2; --tabink:#8E8E93; --fig-paper:#1C1C1E; }

/* Barre de titre fixe */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-inline:-16px;padding:12px 8px 12px 16px;min-height:58px;background:var(--card);border-bottom:1px solid var(--hair)}
.appbar h1{font-size:1.55rem;font-weight:800;letter-spacing:-.02em;line-height:1}
.appbar .iconbtn{color:var(--ink)}
.lead{color:var(--muted);font-size:.94rem;padding-block:14px 14px;max-width:46ch}

/* Onglets soulignés (vues) */
.seg{display:flex;border:0;border-radius:0;background:transparent;overflow-x:auto;scrollbar-width:none;gap:0}
.seg button,.seg button+button{flex:1;border:0;border-radius:0;background:transparent;color:var(--muted);font-weight:600;font-size:.95rem;padding:13px 10px 12px;box-shadow:inset 0 -1px 0 var(--hair)}
.seg button[aria-pressed="true"]{background:transparent;color:var(--ink);box-shadow:inset 0 -3px 0 var(--brand)}
.utabs{margin:-14px -16px 14px;background:var(--card)}
.appbar + .lead + .utabs{margin-top:0}
.figcard .seg{max-width:none;margin:8px -12px -12px;background:transparent;border-top:1px solid var(--hair)}
.figcard .seg button{box-shadow:none}
.figcard .seg button[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--brand)}
.seg-sm{border:1px solid var(--hair2);border-radius:50rem;padding:2px;background:var(--surface2)}
.seg-sm button,.seg-sm button+button{flex:none;padding:.35rem .9rem;font-size:.85rem;border-radius:50rem;box-shadow:none}
.seg-sm button[aria-pressed="true"]{background:var(--brand);color:#fff;box-shadow:none}

/* Blocs pleine largeur sur fond gris */
.list-card{margin-inline:-16px;border-radius:0;border-left:0;border-right:0;box-shadow:none}
.sect-t{padding-top:6px}
.tile,.step,.kpi,.lvl,.cun figure,.pcard,.pnav button,.ev,.gloss,.figcard{box-shadow:none;border-color:transparent}
.tile{border-radius:12px}
.tile:hover{box-shadow:none;border-color:var(--hair2)}
.figcard{border-radius:12px}
.lvl{border-left-width:5px}
.chips{padding-block:4px 12px}
.chip{border-color:var(--hair2);background:var(--card);font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.toc{background:var(--bg)}
.searchhead{background:var(--card);margin-inline:-16px;padding:12px 16px;border-bottom:1px solid var(--hair)}
.roundbtn{display:none}

/* Pages poussées : flèche de retour, titre centré */
.bar{background:var(--card);border-bottom:1px solid var(--hair);padding:6px 8px;min-height:54px}
.bar .bar-t{font-weight:700;font-size:1rem}
.back{padding:8px;color:var(--ink);min-width:44px}
.detail{padding-top:18px}

/* Barre d'onglets du bas */
.tabs{background:var(--card);border-top:1px solid var(--hair);box-shadow:0 -1px 0 rgba(0,0,0,.02)}
.tabs button{color:var(--tabink);font-size:.68rem;font-weight:600;gap:4px;padding:8px 0 7px}
.tabs svg{stroke-width:1.7}
.tabs button[aria-selected="true"]{color:var(--brand)}
.tabs button[aria-selected="true"] svg{stroke-width:2.4}
.tabs button[aria-selected="true"] span{font-weight:800}
.appbar{height:60px;min-height:0;padding-block:0}
.toc{top:calc(env(safe-area-inset-top,0px) + 60px)}
.prose h2{scroll-margin-top:124px}

/* ═══ Barre flottante façon Strava, visible sur toutes les pages ═══ */
.tabs{left:50%;right:auto;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(calc(100% - 24px),520px);z-index:60;
  padding:6px;border-radius:999px;border:1px solid color-mix(in srgb,var(--hair2) 70%,transparent);
  background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:0 8px 28px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.08);gap:2px}
.tabs button{min-height:52px;padding:0;border-radius:999px;justify-content:center;color:var(--ink);transition:background .2s,color .2s}
.tabs svg{width:27px;height:27px;stroke-width:1.9}
.tabs button[aria-selected="true"]{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand)}
.tabs button[aria-selected="true"] svg{stroke-width:2.4}
.tabs button:active{transform:scale(.94)}
.screen{padding-bottom:120px}
.detail{padding-bottom:130px}

/* Titres de section en bleu, liste des fonctions plus compacte */
.sec>h2{color:var(--brand-ink)}
.fn{gap:3px}
.fn li{line-height:1.35}
.fn li::before{margin-top:.45em}

/* Pictos de la barre du bas : plus grands, trait plus fin */
.tabs button{min-height:58px}
.tabs svg{width:40px;height:40px;stroke-width:1.2}
.tabs button[aria-selected="true"] svg{stroke-width:1.5}

/* Google Material Symbols */
.msi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 300,"GRAD" 0,"opsz" 24;user-select:none;overflow:hidden;max-width:1.2em}
.msi-fill{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}
.tabs .msi{font-size:31px;font-variation-settings:"FILL" 0,"wght" 250,"GRAD" 0,"opsz" 40}
.tabs button[aria-selected="true"] .msi{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 40}
.tile-ic .msi{font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 40}
.chev .msi{font-size:20px}
.tabs button[data-tab="profil"] .msi{font-size:36px}

/* Bascule Détail / Corps entier, dans l'esprit de la barre du bas */
.figcard{padding-bottom:16px}
.figcard .seg.seg-pill{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:16px auto 0;max-width:340px;padding:5px;border:1px solid var(--hair);border-top:1px solid var(--hair);border-radius:999px;background:var(--surface2);overflow:visible}
.figcard .seg.seg-pill button,.figcard .seg.seg-pill button+button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 12px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-weight:600;font-size:.92rem;box-shadow:none}
.figcard .seg.seg-pill button[aria-pressed="true"]{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);box-shadow:none}
.figcard .seg.seg-pill .msi{font-size:21px;width:1em}
.figcard .seg.seg-pill button[aria-pressed="true"] .msi{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}
.figcard .cap{margin:12px 0 0;line-height:1.3}
/* Titres fixes */
.appbar,.searchhead{position:fixed;top:0;left:0;right:0;z-index:20;margin:0;box-sizing:border-box;height:calc(60px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(8px,calc(50% - 312px)) 0 max(16px,calc(50% - 304px));display:flex;align-items:center;background:var(--card);border-bottom:1px solid var(--hair)}
.searchhead{padding-right:max(16px,calc(50% - 304px))}
.screen{padding-top:calc(60px + env(safe-area-inset-top,0px))}
/* Langage clair & Pratiquer enrichi */
.sec>h2 .h2-note{font-size:.78rem;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px;text-transform:none}
.pos-i{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px;padding:12px 16px;font-size:.92rem}
.pos-i+.pos-i{border-top:1px solid var(--hair)}
.pos-i b{font-weight:600}
.pos-i span{color:var(--muted)}
.scale{display:grid;grid-template-columns:3fr 3fr 4fr;gap:4px;margin-top:6px}
.sc{padding:10px 8px;text-align:center;border-radius:10px;background:var(--surface2)}
.sc b{display:block;font-weight:700;font-variant-numeric:tabular-nums}
.sc span{display:block;font-size:.78rem;color:var(--muted);margin-top:1px}
.sc-ok{background:var(--brand);color:#fff}
.sc-ok span{color:rgba(255,255,255,.88)}
.sc-hi{background:color-mix(in srgb,var(--point) 14%,var(--card))}
.sc-hi b{color:var(--point)}
.mat{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:start;padding:14px 16px}
.mat+.mat{border-top:1px solid var(--hair)}
.mat-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-ink)}
.mat-ic .msi{font-size:26px}
.mat b{display:block;font-weight:600}
.mat p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.clock-k{display:block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--el,var(--brand));margin-bottom:2px}
.hours{margin:12px 0 14px}
.hours .lrow{min-height:56px;padding-block:9px}

.br-ball,.br-glow{position:absolute;left:12px;top:0;width:88px;height:88px;border-radius:50%;will-change:transform}
.br-glow{background:radial-gradient(circle,color-mix(in srgb,var(--brand) 55%,transparent),transparent 68%);filter:blur(10px)}
.br-ball{background:
  radial-gradient(circle at 32% 26%,rgba(255,255,255,.95) 0 5%,rgba(255,255,255,.4) 11%,rgba(255,255,255,0) 30%),
  radial-gradient(circle at 70% 78%,rgba(140,200,255,.5),rgba(140,200,255,0) 38%),
  radial-gradient(circle at 50% 45%,var(--ball-hi) 0%,var(--ball-mid) 52%,var(--ball-lo) 100%);
  box-shadow:0 10px 28px color-mix(in srgb,var(--brand) 38%,transparent),inset -8px -10px 18px rgba(0,20,80,.35),inset 6px 6px 14px rgba(255,255,255,.2)}
.br-foot{padding:0 0 calc(18px + env(safe-area-inset-bottom,0px))}
.br-lbl{text-align:center;font-size:.875rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.br-ruler{position:relative}
.br-vals{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px}
.br-vals .v-side{font-size:1.125rem;font-weight:500;color:var(--muted);padding:4px 10px;min-height:40px}
.br-vals .v-side:first-child{justify-self:start}
.br-vals .v-side:last-child{justify-self:end}
.br-vals .v-cur{font-size:2.3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.br-scroll{overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;height:46px;margin-top:6px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
.br-scroll::-webkit-scrollbar{display:none}
.br-ticks{display:flex;width:max-content;height:100%;padding-inline:calc(50% - 6px)}
.br-ticks .tk{flex:none;width:12px;height:100%;position:relative}
.br-ticks .tk::after{content:"";position:absolute;left:50%;bottom:8px;width:1.5px;height:13px;margin-left:-.75px;border-radius:1px;background:var(--hair2)}
.br-ticks .tk-M{scroll-snap-align:center}
.br-ticks .tk-M::after{height:22px;background:var(--muted)}
.br-needle{position:absolute;left:50%;bottom:8px;width:3px;height:34px;margin-left:-1.5px;border-radius:2px;background:var(--brand);pointer-events:none}
.br-go{margin-top:16px}
.br-run{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 2px}
.br-left{display:grid}
.br-left b{font-size:2.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.br-left small{font-size:.9375rem;color:var(--muted);margin-top:4px}
.br-ctrl{display:flex;align-items:center;gap:16px}
.br-round{width:60px;height:60px;border-radius:999px;display:grid;place-items:center;background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgb(0 0 0 / .12)}
.br-round .msi{font-size:30px}
.br-round.br-main{width:80px;height:80px;background:var(--brand);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--brand) 40%,transparent)}
.br-round.br-main .msi{font-size:46px}
.br-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.br-custom ~ .br-stage{padding:12px 0}
.br-custom ~ .br-stage .br-track{height:clamp(200px,32vh,400px)}
@media (max-height:700px){.br-track{height:clamp(190px,34vh,360px)}.br-head{margin-top:10px}.br-title{font-size:1.9rem}}
/* carte d'entrée (Émotions & esprit) */
.brc{margin-top:16px;padding:16px;border-radius:16px;background:var(--card)}
.brc-main{display:grid;grid-template-columns:52px minmax(0,1fr);gap:16px;align-items:center;width:100%;text-align:left}
.brc-viz{position:relative;width:52px;height:84px;border-radius:999px;background:var(--seg-track)}
.brc-ball{position:absolute;left:8px;top:8px;width:36px;height:36px;border-radius:50%;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95) 0 5%,rgba(255,255,255,.4) 12%,rgba(255,255,255,0) 32%),radial-gradient(circle at 50% 45%,var(--ball-hi) 0%,var(--ball-mid) 52%,var(--ball-lo) 100%);
  box-shadow:0 4px 12px color-mix(in srgb,var(--brand) 40%,transparent);animation:brcBob 10s ease-in-out infinite}
@keyframes brcBob{0%,100%{transform:translateY(32px)}50%{transform:translateY(0)}}
.brc-t{display:grid;gap:2px}
.brc-t small{font-size:.8125rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-ink)}
.brc-t b{font-size:1.1875rem;font-weight:700}
.brc-t span{font-size:.9375rem;line-height:1.4;color:var(--muted)}
.brc-quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.brc-quick button{display:grid;gap:2px;justify-items:center;text-align:center;padding:10px 4px;border-radius:12px;background:var(--seg-track);color:var(--ink)}
.brc-quick b{font-size:.9375rem;font-weight:600}
.brc-quick small{font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums}
.brc-h{font-size:.875rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--brand-ink);margin:24px 2px 8px}
.snd-test{justify-self:start;min-height:42px;border-radius:999px;padding:0 18px}
.snd-test .msi{font-size:22px}
@media (prefers-reduced-motion: reduce){.brc-ball{animation:none;transform:translateY(16px)}}
.mbar .bar-r{display:flex;align-items:center;gap:0}
.br-stage{padding:12px 0;min-height:200px}
.br-track{height:clamp(200px,36vh,420px)}
.br-custom ~ .br-stage .br-track{height:clamp(180px,26vh,380px)}

/* respiration v3 : durée ±30 s, son guide, carte sans animation */
.brc-main{display:block}
.br-set{background:var(--card);border-radius:14px;overflow:hidden}
.br-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px}
.br-row+.br-row{border-top:1px solid var(--hair)}
.br-row.col{display:grid;gap:8px;justify-content:stretch}
.br-rl{font-weight:600;font-size:1rem}
.br-durc{display:flex;align-items:center;gap:12px}
.br-durc button{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;background:var(--seg-track);color:var(--ink)}
.br-durc button:disabled{opacity:.3}
.br-durc .msi{font-size:24px}
.br-durc b{min-width:96px;text-align:center;font-size:1.375rem;font-weight:700;font-variant-numeric:tabular-nums}
.br-tones button{font-size:.875rem;padding:0 4px}
.br-go{margin-top:12px}
.br-stage{padding:10px 0;min-height:180px}
.br-track{height:clamp(180px,30vh,400px)}
.br-custom ~ .br-stage .br-track{height:clamp(160px,22vh,360px)}

/* ── Respiration v4 ── */
/* carte d'entrée : même ligne que « Séance guidée » */
.brc-cta .sess-cta-ic{background:var(--brand-soft);color:var(--brand-ink)}
.brc-cta .sess-cta-ic .msi{font-size:26px}
/* réglages */
.detail.brs{padding-bottom:12px}
.rhy{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rhy-cell{display:grid;justify-items:center;gap:6px;padding:12px 8px;border-radius:12px;background:var(--seg-track)}
.rhy-top{display:flex;align-items:center;gap:6px;font-size:.875rem;font-weight:600;color:var(--muted)}
.rhy-top .msi{font-size:18px;color:var(--brand-ink)}
.rhy-v{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.rhy-adj{display:flex;align-items:center;gap:8px}
.rhy-adj b{min-width:44px;text-align:center;font-size:1.375rem;font-weight:700;font-variant-numeric:tabular-nums}
.rhy-adj button{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.rhy-adj button:disabled{opacity:.35}
.rhy-adj .msi{font-size:20px}
.rhy-bar{display:flex;gap:3px;height:6px}
.rhy-bar i{border-radius:3px;background:var(--brand)}
.rhy-bar i+i{background:color-mix(in srgb,var(--brand) 30%,var(--seg-track))}
.rhy-note{text-align:center;color:var(--muted);font-size:.9375rem}
.brs-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brs-line>span:first-child{display:grid;gap:1px}
.brs-line b{font-weight:600}
.brs-line small{color:var(--muted);font-size:.9375rem}
.brs-step{display:flex;align-items:center;gap:10px}
.brs-step button{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;background:var(--seg-track);color:var(--ink)}
.brs-step button:disabled{opacity:.35}
.brs-step .msi{font-size:22px}
.brs-step b{min-width:84px;text-align:center;font-size:1.125rem;font-weight:700;font-variant-numeric:tabular-nums}
/* séance */
.brp{display:flex;flex-direction:column;height:calc(100vh - 56px - env(safe-area-inset-top,0px));height:calc(100dvh - 56px - env(safe-area-inset-top,0px));max-width:560px;margin:0 auto;padding:16px 16px 0}
.brp-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 0 20px}
.brp .br-track{width:min(150px,38vw);height:100%;max-height:620px;min-height:260px;border-radius:999px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 10%,var(--card)) 0%,var(--card) 70%);box-shadow:inset 0 0 0 1px var(--hair),0 1px 3px rgb(0 0 0 / .05)}
.brp .br-ball,.brp .br-glow{left:50%;width:calc(100% - 24px);height:auto;aspect-ratio:1;margin-left:calc(-50% + 12px)}
.brp-dock{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px 4px calc(22px + env(safe-area-inset-bottom,0px))}
.brp-time{display:grid;justify-items:center;gap:2px}
.brp-time b{font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.01em}
.brp-time small{color:var(--muted);font-size:.9375rem}
.brp-btn{display:grid;justify-items:center;gap:6px;font-size:.875rem;font-weight:600;color:var(--muted)}
.brp-btn:first-child{justify-self:start}
.brp-btn.main{justify-self:end;color:var(--brand-ink)}
.brp-ic{width:68px;height:68px;border-radius:999px;display:grid;place-items:center;background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgb(0 0 0 / .12)}
.brp-ic .msi{font-size:32px}
.brp-btn.main .brp-ic{background:var(--brand);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--brand) 40%,transparent)}
.brp-btn.main .brp-ic .msi{font-size:40px}
.brp-end{flex-direction:column;gap:10px;text-align:center}
.brp-ok{color:var(--succ)}
.brp-ok .msi{font-size:72px}
.brp-end .sx-sum{justify-content:center}
.brp-dock.two{grid-template-columns:1fr 1fr}

/* ── v26 · Sections repliables (Pratiquer, Repères) ── */
.toc2{margin:0 0 20px}
.toc2-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.toc2-h .sect-t{margin:0;padding:0}
.toc2-all{min-height:44px;padding:0 2px 0 12px;font-size:.875rem;font-weight:600;color:var(--brand-ink)}
.toc2-c{display:flex;flex-wrap:wrap;gap:8px}
.toc2-c .chip{min-height:40px;padding:.45rem 1rem;font-weight:600;color:var(--brand-ink);border-color:var(--hair2)}
.toc2-c .chip:active{background:var(--brand-soft)}
.accs{display:grid;gap:10px}
.acc{scroll-margin-top:calc(68px + env(safe-area-inset-top,0px))}
.acc-h{margin:0;font-size:inherit;font-weight:inherit;line-height:inherit}
.acc-b{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) 24px;align-items:center;gap:14px;min-height:72px;padding:12px 14px;background:var(--card);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow-sm);text-align:left;color:var(--ink);transition:border-color .2s}
.acc-b:active{background:color-mix(in srgb,var(--brand) 5%,var(--card))}
.acc-b:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.acc-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-ink)}
.acc-ic .msi{font-size:22px;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24}
.acc-t{min-width:0}
.acc-t b{display:block;font-size:1rem;font-weight:600;line-height:1.3}
.acc-t small{display:block;margin-top:2px;font-size:.875rem;line-height:1.35;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-chev{font-size:24px;color:var(--muted);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.acc.open .acc-chev{transform:rotate(180deg);color:var(--brand-ink)}
.acc.open .acc-b{border-color:var(--brand-border)}
.acc.open .acc-h{position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:5}
.acc.open .acc-h::before{content:"";position:absolute;inset:-10px 0 auto;height:10px;background:var(--bg)}
.acc-p{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.8,.2,1)}
.acc.open .acc-p{grid-template-rows:1fr}
.acc-in{min-height:0;overflow:hidden}
.acc-body{padding:20px 0 24px}
.acc-body>:first-child{margin-top:0}
.acc-body>:last-child{margin-bottom:0}
@media (prefers-reduced-motion:reduce){.acc-p,.acc-chev{transition:none}}

/* ── v26 · Rythme vertical ──
   Espaces : 4 · 8 · 12 · 16 · 24 · 32. Titre de section → contenu : 12. Entre sections : 32. */
:root{--gap-sec:32px;--gap-h:12px;--gap-blk:16px}
.lead{padding-block:12px 20px;max-width:60ch}
.sect,.sec{margin-top:var(--gap-sec)}
.sect-t,.sec>h2{margin:0 0 var(--gap-h);padding-top:0;line-height:1.3;font-weight:700;letter-spacing:.04em;color:var(--brand-ink)}
.howto h2{margin-bottom:8px;line-height:1.3}
.prose p,.prose ul{margin:0 0 12px}
.prose li{margin-bottom:8px}
.prose li:last-child{margin-bottom:0}
.prose h3{margin:28px 0 var(--gap-h);font-size:1rem;line-height:1.3}
.prose>h3:first-child,.acc-body>h3:first-child{margin-top:0}
.prose .steps,.prose .kpis,.prose .scale,.prose .cun,.prose .hours,.prose .mats,.prose .pos,.prose .list-card,.prose .card{margin-top:var(--gap-blk);margin-bottom:var(--gap-blk)}
.prose .lvl{margin:0 0 12px}
.prose .lvl+.lvl{margin-top:0}
.prose p+.lvl,.prose ul+.lvl,.prose .list-card+.lvl{margin-top:var(--gap-blk)}
.prose .scale+p{margin-top:8px}
.prose .fine{margin-top:0}
/* Longueur de ligne confortable : environ 65 caractères */
.prose p,.prose ul,.sec p,.step p,.lex-i p,.mat p,.ex p,.howto p,.tips li,.warnlist li,.note,.lvl p,.care,.ev,.fine,.sub,.ptr{max-width:65ch}
.cap{max-width:65ch;margin-inline:auto}
.detail>.sec:first-of-type{margin-top:28px}
.ptop{margin-bottom:12px}
.sub,.ptr{margin-top:8px}

.acc-body.prose>:first-child{margin-top:0}
.acc-t small{white-space:normal;overflow:visible;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── v27 · Quand consulter ── */
.see-dr{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;align-items:start;padding:14px 16px;background:var(--card);border-radius:var(--r);border-left:4px solid var(--alert)}
.see-dr-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--alert-soft);color:var(--alert)}
.see-dr-ic .msi{font-size:22px;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24}
.see-dr p{font-size:.9375rem;line-height:1.5;max-width:65ch}

/* ═══ v28 · Typographie : un cran plus grand partout ═══
   Les tailles sont en rem : la racine passe de 16 à 17 px, donc
   corps 17 px · secondaire 16 px · étiquettes 15 px · titres +6 %.
   Les espacements restent en px : le rythme vertical ne change pas. */
html{font-size:106.25%}
body{font-size:1rem}

/* ═══ v28 · Planches illustrées ═══ */
:root{--pl-point:#D2381F;--pl-cun:#1D5A53;--pl-ink:#22302C;--pl-bg:#EDF1EC;--pl-bg2:#E3E9E2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pl-bg:#1D2220;--pl-bg2:#252B28}}
:root[data-theme="dark"]{--pl-bg:#1D2220;--pl-bg2:#252B28}
.plate{position:relative;width:100%;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,var(--pl-bg) 0%,var(--pl-bg2) 100%);border-radius:14px;isolation:isolate;-webkit-user-select:none;user-select:none}
.pl-imgs{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.pl-rep{opacity:.4}
.pl-ov{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;touch-action:manipulation}
.plate.pl-broken .pl-imgs{visibility:hidden}
.plate.pl-broken::after{content:"Illustration indisponible";position:absolute;inset:auto 0 12px;text-align:center;color:var(--muted);font-size:.875rem}
/* point */
.pl-dot{fill:var(--pl-point);stroke:#fff;stroke-width:2.5px;vector-effect:non-scaling-stroke;filter:drop-shadow(0 1px 1.5px rgb(0 0 0 / .35))}
.pl-halo{fill:var(--pl-point);opacity:.2;transform-box:fill-box;transform-origin:center;animation:plPulse 2.4s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes plPulse{0%{transform:scale(.55);opacity:.42}75%{transform:scale(1.45);opacity:0}100%{transform:scale(1.45);opacity:0}}
.pl-pt.is-mir .pl-dot{opacity:.9}
.pl-pt.is-ghost .pl-dot{fill:rgb(255 255 255 / .85);stroke:var(--pl-point);stroke-width:2px;stroke-dasharray:3 2.5;filter:none}
/* repères, cun, étiquettes */
.pl-lm{fill:#fff;stroke:var(--pl-ink);stroke-width:1.6px;vector-effect:non-scaling-stroke}
.pl-lbl rect{fill:rgb(255 255 255 / .9);stroke:rgb(34 48 44 / .12);stroke-width:1px;vector-effect:non-scaling-stroke}
.pl-lbl text{fill:var(--pl-ink);font-family:var(--f-body);font-weight:600}
.pl-code rect{fill:var(--pl-point)}
.pl-code text{fill:#fff;font-family:var(--f-mono);font-weight:700}
.pl-cun path{fill:none;stroke:var(--pl-cun);stroke-linecap:round;vector-effect:non-scaling-stroke}
.pl-cun .dim{stroke-width:1.6px}
.pl-cun .ext{stroke-width:1.1px;stroke-dasharray:2 3;opacity:.85}
.pl-cun-t rect{fill:rgb(255 255 255 / .92);stroke:color-mix(in srgb,var(--pl-cun) 35%,transparent);stroke-width:1px;vector-effect:non-scaling-stroke}
.pl-cun-t text{fill:var(--pl-cun);font-family:var(--f-body);font-weight:700}
/* planches à plusieurs points */
.pl-path{fill:none;stroke-width:3px;stroke-linecap:round;stroke-linejoin:round;opacity:.75;vector-effect:non-scaling-stroke}
.pl-path.is-mir{opacity:.3;stroke-dasharray:1 6}
.pl-mk{fill:#fff;stroke:var(--pl-point);stroke-width:3px;vector-effect:non-scaling-stroke;transition:fill .15s}
.pl-tap .hit{fill:transparent}
.pl-tap{cursor:pointer;outline:none}
.pl-tap:hover .pl-mk,.pl-tap:focus-visible .pl-mk,.pl-tap:active .pl-mk{fill:var(--pl-point)}
.pl-mlbl rect{fill:rgb(255 255 255 / .88)}
.pl-mlbl text{fill:var(--pl-ink);font-family:var(--f-mono);font-weight:700}
/* vignette de repérage */
.pl-loc{position:absolute;top:8px;right:8px;z-index:2;display:flex;align-items:flex-end;gap:0;padding:4px;border-radius:10px;line-height:0;
 background:color-mix(in srgb,var(--card) 84%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 1px 3px rgb(0 0 0 / .14)}
.loc-svg{display:block;height:58px;width:auto}
.loc-r{fill:color-mix(in srgb,var(--brand) 26%,transparent);stroke:var(--brand);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.loc-old .sil-o{stroke-width:1px}
.loc-old .sil-d{display:none}
button.pl-loc{cursor:pointer;min-width:44px;min-height:44px}
button.pl-loc .msi{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;max-width:none;border-radius:999px;display:grid;place-items:center;font-size:15px;background:var(--brand);color:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .25)}
button.pl-loc:active{transform:scale(.96)}
.pl-card .loc-svg{height:40px}
.pl-card .pl-loc{top:6px;right:6px;padding:3px;border-radius:8px}
/* ancien schéma dans le même cadre */

.sg-bar i{position:absolute;inset:0;border-radius:999px;background:var(--brand);transform:scaleX(0);transform-origin:left center;transition:transform .25s linear}
.is-find .sg-bar i{background:color-mix(in srgb,var(--brand) 55%,var(--card))}
.is-paused .sg-bar i{background:color-mix(in srgb,var(--brand) 35%,var(--hair2))}
.sg-next{margin-top:14px;padding:0 4px;border-top:0}
.sg-ctrl{display:none}
@media (max-height:700px){
 .sg-how{margin-top:8px}
 .sg-card{margin-top:10px;padding:12px 14px 14px}
 .sg-st{gap:6px}
 .sg-bar{margin-top:10px}
}

.sess-wrap.sg .sg-main{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
/* v30.1 · Pratiquer homogène : listes « facts » et jauge de pression */
.facts{padding:0}
.fact{display:flex;gap:14px;padding:14px 16px}
.fact+.fact{border-top:1px solid var(--hair)}
.fact b{display:block;font-weight:600;font-size:1rem;line-height:1.3}
.fact p{margin:3px 0 0;color:var(--muted);font-size:.9375rem;line-height:1.45}
.fact>div{min-width:0}
.fact-n{flex:none;width:26px;height:26px;border-radius:999px;display:grid;place-items:center;background:color-mix(in srgb,var(--brand) 12%,var(--card));color:var(--brand-ink);font-weight:700;font-size:.875rem;margin-top:1px}
.prose .facts,.prose .gauge{margin-top:var(--gap-blk);margin-bottom:var(--gap-blk)}
.gauge{margin-left:0;margin-right:0;padding:16px;background:var(--card);border-radius:var(--r)}
.gauge-bar{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.gauge-bar i{position:relative;height:14px;border-radius:4px;font-style:normal}
.gauge-bar i span{position:absolute;top:20px;left:0;right:0;text-align:center;font-size:.75rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.gauge-bar .glo{background:color-mix(in srgb,var(--brand) 18%,var(--hair2))}
.gauge-bar .gok{background:var(--brand)}
.gauge-bar .ghi{background:color-mix(in srgb,var(--point) 55%,var(--card))}
.gauge-bar i:first-child{border-radius:7px 4px 4px 7px}.gauge-bar i:last-child{border-radius:4px 7px 7px 4px}
.gauge-l{display:grid;grid-template-columns:3fr 3fr 4fr;gap:4px;margin-top:30px;font-size:.8125rem;font-weight:600;text-align:center}
.gauge-l .glo{color:var(--muted)}.gauge-l .gok{color:var(--brand-ink)}.gauge-l .ghi{color:var(--point)}
.acc-body .facts,.prose .facts{margin-left:0!important;margin-right:0!important;border-radius:var(--r);overflow:hidden}
.kpi b{white-space:nowrap;font-size:1rem}
.climats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 var(--gap-blk)}
.clim{padding:14px;border-radius:var(--r);background:var(--card);display:grid;gap:4px;align-content:start}
.clim .msi{font-size:24px;color:var(--brand-ink)}
.clim b{font-weight:600;font-size:1rem}
.clim p{margin:0;color:var(--muted);font-size:.875rem;line-height:1.4}
.prose h3{margin-top:22px}

/* ═══ v31 · Parcours d'un protocole, point par point ═══ */
.wk-head{position:sticky;top:0;z-index:6;background:var(--card);border-bottom:1px solid var(--hair)}
.wk-head .bar{position:static;border-bottom:0}
.wk-ctx{max-width:640px;margin:0 auto;padding:0 16px 8px}
.wk-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.wk-name{min-width:0;font-size:.875rem;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-count{flex:none;font-size:.8125rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.wk-segs{display:flex;gap:4px;margin:2px 0 -4px}
.wk-seg{flex:1;min-width:0;height:24px;display:grid;align-items:center;cursor:pointer}
.wk-seg i{display:block;height:4px;border-radius:2px;background:var(--hair2);transition:background .25s,height .2s}
.wk-seg.done i{background:color-mix(in srgb,var(--brand) 45%,var(--hair2))}
.wk-seg.cur i{background:var(--brand);height:6px}
.wk-seg.is-ci i{background:color-mix(in srgb,var(--point) 55%,var(--hair2))}
.wk-seg.is-ci.cur i{background:var(--point)}
.wk-seg:focus-visible{box-shadow:none}
.wk-seg:focus-visible i{outline:2px solid var(--brand);outline-offset:3px}
.wk-first{display:inline-flex;align-items:center;gap:4px;min-height:32px;margin-top:4px;padding:0 2px;font-size:.8125rem;font-weight:600;color:var(--brand-ink)}
.wk-first .msi{font-size:18px}
.sheet.walk .detail.wk-detail{padding-bottom:28px}
/* fin du protocole */
.wk-done{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;align-items:start;margin-top:32px;padding:16px;border-radius:16px;background:var(--card)}
.wk-done-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--succ) 14%,var(--card));color:var(--succ)}
.wk-done-ic .msi{font-size:24px}
.wk-done b{display:block;font-weight:600}
.wk-done p{margin-top:2px;color:var(--muted);font-size:.9375rem;line-height:1.45}
.wk-sess{margin-top:12px;min-height:44px;border-radius:999px;padding:0 18px}
.wk-sess .msi{font-size:22px}
/* barre du bas, dans la zone du pouce */
.wk-foot{position:sticky;bottom:0;z-index:6;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px max(16px,calc(50% - 304px)) calc(10px + env(safe-area-inset-bottom,0px));
 background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border-top:1px solid var(--hair)}
.wk-prev{display:inline-flex;align-items:center;gap:6px;min-height:54px;padding:0 16px 0 12px;border-radius:14px;background:var(--seg-track);color:var(--ink);font-weight:600;font-size:.9375rem}
.wk-prev .msi{font-size:20px}
.wk-prev:disabled{opacity:.38;cursor:default}
.wk-next{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px;padding:6px 14px 6px 16px;border-radius:14px;background:var(--brand);color:#fff;text-align:left;box-shadow:0 4px 14px color-mix(in srgb,var(--brand) 28%,transparent)}
.wk-next:active,.wk-prev:active{transform:scale(.98)}
.wk-next .msi{flex:none;font-size:22px}
.wk-next-t{min-width:0;display:grid;gap:1px}
.wk-next-t small{font-size:.75rem;font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}
.wk-next-t b{display:flex;align-items:center;gap:7px;min-width:0;font-size:.9375rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-code{flex:none;font-family:var(--f-mono);font-size:.75rem;font-weight:700;padding:.15em .5em;border-radius:999px;background:rgb(255 255 255 / .2)}
.wk-next.wk-end{justify-content:center;gap:8px}
.wk-next.wk-end .wk-next-t b{font-size:1rem}
/* passage d'un point à l'autre */
.wk-in-next{animation:wkInN .28s cubic-bezier(.2,.8,.2,1)}
.wk-in-prev{animation:wkInP .28s cubic-bezier(.2,.8,.2,1)}
@keyframes wkInN{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes wkInP{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.wk-in-next,.wk-in-prev{animation:none}.wk-seg i{transition:none}}
@media (max-width:360px){.wk-prev{padding:0 12px 0 10px}}
.wk-row{align-items:center;min-height:30px}
.wk-row .wk-count{margin-left:auto}
.wk-first{flex:none;min-height:28px;margin:0 -4px 0 0;padding:0 10px 0 6px;border-radius:999px;background:var(--brand-soft);font-size:.75rem}
.wk-first .msi{font-size:16px}
/* v31.1 · en-têtes des fiches solidaires de la page : ils défilent avec le contenu */
.sheet .bar{position:relative;top:auto;background:transparent;border-bottom:0}
.sheet .wk-head{position:relative;top:auto;background:transparent;border-bottom:0}
